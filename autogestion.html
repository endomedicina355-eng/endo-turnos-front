<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ENDO Medicina · Turnos</title>

  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial; margin:0; background:#f6f7f8; color:#111;}
    .wrap{max-width:980px; margin:0 auto; padding:18px;}
    .card{background:#fff; border:1px solid #e7e7e7; border-radius:14px; padding:16px; margin:12px 0;}
    .header{display:flex; justify-content:space-between; gap:10px; align-items:flex-start;}
    .brand{font-weight:800}
    .muted{color:#666; font-size:13px}
    .pill{display:inline-block; padding:6px 10px; border-radius:999px; border:1px solid #ddd; font-size:12px; background:#fff}

    .grid{display:grid; grid-template-columns:1fr; gap:12px;}
    @media(min-width:900px){ .grid{grid-template-columns:1.1fr .9fr;} }

    /* Calendar */
    .calWrap{display:grid; gap:12px;}
    @media(min-width:740px){ .calWrap{grid-template-columns:1fr 1fr;} }
    .month{border:1px solid #eee; border-radius:14px; padding:12px;}
    .monthTitle{font-weight:800; margin:0 0 8px 0;}
    .dow{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:6px;}
    .dow div{font-size:12px; color:#777; text-align:center;}
    .daysGrid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
    .dayCell{height:38px; border-radius:10px; border:1px solid #eee; background:#fff; cursor:pointer; font-size:13px;}
    .dayCell:disabled{opacity:.35; cursor:not-allowed; background:#fafafa;}
    .dayCell.active{border-color:#111; box-shadow:0 1px 0 rgba(0,0,0,.06)}
    .dayCell.inRange{border-color:#ddd;}
    .dayCell.empty{border:0; background:transparent; cursor:default;}

    .slots{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px}
    @media(max-width:520px){ .slots{grid-template-columns:repeat(2, minmax(0,1fr));} }
    .slotbtn{border:1px solid #ddd; background:#fff; border-radius:12px; padding:10px; cursor:pointer; text-align:center}
    .slotbtn.active{border-color:#111}

    .row{display:grid; gap:10px; grid-template-columns:1fr 1fr}
    @media(max-width:700px){ .row{grid-template-columns:1fr} }

    input{width:100%; padding:10px 12px; border-radius:12px; border:1px solid #ddd; font-size:14px}
    button.primary{background:#111; color:#fff; border:0; border-radius:12px; padding:12px 14px; font-weight:700; cursor:pointer; width:100%}
    button.primary:disabled{opacity:.45}
    .error{color:#b00020; font-size:13px}
    .ok{color:#0a7a27; font-size:13px}

    .checks{display:flex; gap:14px; flex-wrap:wrap; margin-top:10px;}
    .checkItem{display:flex; align-items:center; gap:8px; font-size:13px; color:#333;}
    .checkItem input{width:auto}

    /* Modal confirm */
    .modalBack{
      position:fixed; inset:0; background:rgba(0,0,0,.45);
      display:none; align-items:center; justify-content:center;
      padding:18px; z-index:9999;
    }
    .modal{
      width:min(560px, 100%);
      background:#fff; border-radius:16px; border:1px solid #e7e7e7;
      padding:16px;
      box-shadow:0 10px 40px rgba(0,0,0,.25);
    }
    .modal h3{margin:0 0 6px 0}
    .kv{display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:12px;}
    .kv div{border:1px solid #eee; border-radius:12px; padding:10px}
    .kv b{display:block; font-size:12px; color:#666; margin-bottom:4px}
    .modalBtns{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px}
    .btnGhost{
      background:#fff; border:1px solid #ddd; border-radius:12px; padding:12px 14px;
      font-weight:700; cursor:pointer; width:100%;
    }
    .btnDanger{
      background:#fff; border:1px solid #ddd; border-radius:12px; padding:12px 14px;
      font-weight:700; cursor:pointer; width:100%;
    }
  </style>
</head>

<body>
<div class="wrap">
  <div class="header">
    <div>
      <div class="brand">ENDO Medicina</div>
      <div class="muted">Turnos online</div>
      <div class="muted" id="medicoLine">Médico: —</div>
      <div class="muted" id="espLine"></div>
    </div>
    <div class="pill" id="tzPill">TZ: AR (Buenos Aires)</div>
  </div>

  <div class="card">
    <div class="muted" id="horizonLine">Próximos — días</div>
    <div class="calWrap" id="calendar"></div>
    <div class="error" id="errDays"></div>
  </div>

  <div class="grid">
    <div class="card">
      <div style="font-weight:800" id="dayTitle">Horarios</div>
      <div class="slots" id="slots"></div>
      <div class="error" id="errSlots"></div>
    </div>

    <div class="card">
      <div style="font-weight:800">Confirmar turno</div>
      <div class="muted">Seleccionado: <b id="chosenSlot">—</b></div>

      <div class="row" style="margin-top:10px">
        <input id="nombre" placeholder="Nombre y apellido"/>
        <input id="dni" placeholder="DNI"/>
      </div>

      <div class="row">
        <input id="telefono" placeholder="Teléfono"/>
        <input id="email" placeholder="Email"/>
      </div>

      <div class="row">
        <input id="obra_social" placeholder="Obra social"/>
        <input id="numero_afiliado" placeholder="N° afiliado"/>
      </div>

      <div class="checks">
        <label class="checkItem">
          <input type="checkbox" id="chkNoEmail" />
          No tengo mail
        </label>

        <label class="checkItem">
          <input type="checkbox" id="chkParticular" />
          Sin obra social (Particular)
        </label>
      </div>

      <div class="error" id="errBook" style="margin-top:10px"></div>
      <div class="ok" id="okBook"></div>

      <button class="primary" id="btnBook" disabled style="margin-top:10px">Confirmar</button>
    </div>
  </div>
</div>

<!-- Modal Confirmación -->
<div class="modalBack" id="modalBack">
  <div class="modal">
    <h3>✅ Turno confirmado</h3>
    <div class="muted">Podés imprimir o compartir esta confirmación.</div>

    <div class="kv" id="kvBox"></div>

    <div class="modalBtns">
      <button class="btnGhost" id="btnShare">Compartir / Copiar</button>
      <button class="btnGhost" id="btnPrint">Imprimir</button>
      <button class="btnDanger" id="btnClose">Cerrar</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* ================= CONFIG ================= */
const SUPABASE_URL = "https://qqfjvxspiyecuthislnq.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFxZmp2eHNwaXllY3V0aGlzbG5xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk2MjE2OTQsImV4cCI6MjA4NTE5NzY5NH0.xHIldO1nBfhHJYLuskqJbkX95EbxRAjc4Y3SqHhlx3A";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ================= PARAMS ================= */
const params = new URLSearchParams(window.location.search);
const MEDICO_ID_QS = params.get("medico_id"); // legacy
const SLUG_QS = params.get("m");              // nuevo: ?m=slug

/* ================= DOM ================= */
const medicoLine   = document.getElementById("medicoLine");
const espLine      = document.getElementById("espLine");
const horizonLine  = document.getElementById("horizonLine");
const calBox       = document.getElementById("calendar");
const daysErr      = document.getElementById("errDays");

const slotsBox     = document.getElementById("slots");
const errSlots     = document.getElementById("errSlots");
const dayTitle     = document.getElementById("dayTitle");
const chosenSlot   = document.getElementById("chosenSlot");

const btnBook      = document.getElementById("btnBook");
const errBook      = document.getElementById("errBook");
const okBook       = document.getElementById("okBook");

const chkNoEmail   = document.getElementById("chkNoEmail");
const chkParticular= document.getElementById("chkParticular");
const inEmail      = document.getElementById("email");
const inOS         = document.getElementById("obra_social");
const inAf         = document.getElementById("numero_afiliado");

/* Modal */
const modalBack = document.getElementById("modalBack");
const kvBox     = document.getElementById("kvBox");
const btnShare  = document.getElementById("btnShare");
const btnPrint  = document.getElementById("btnPrint");
const btnClose  = document.getElementById("btnClose");

/* ================= HELPERS (AR TZ) ================= */
const AR_TZ = "America/Argentina/Buenos_Aires";

function isoDateAR(d) {
  const parts = new Intl.DateTimeFormat("en-CA", { timeZone: AR_TZ, year:"numeric", month:"2-digit", day:"2-digit"}).formatToParts(d);
  const y = parts.find(p=>p.type==="year").value;
  const m = parts.find(p=>p.type==="month").value;
  const da = parts.find(p=>p.type==="day").value;
  return `${y}-${m}-${da}`;
}
function fmtDMY(yyyy_mm_dd) {
  const [y,m,d] = yyyy_mm_dd.split("-");
  return `${d}/${m}/${y}`;
}
function addDaysISO(yyyy_mm_dd, n) {
  const [y,m,d] = yyyy_mm_dd.split("-").map(Number);
  const dt = new Date(Date.UTC(y, m-1, d));
  dt.setUTCDate(dt.getUTCDate() + n);
  const y2 = dt.getUTCFullYear();
  const m2 = String(dt.getUTCMonth()+1).padStart(2,"0");
  const d2 = String(dt.getUTCDate()).padStart(2,"0");
  return `${y2}-${m2}-${d2}`;
}
function monthKey(yyyy_mm_dd) { return yyyy_mm_dd.slice(0,7); }
function nextMonthKey(yyyy_mm) {
  const [y,m] = yyyy_mm.split("-").map(Number);
  const dt = new Date(Date.UTC(y, m-1, 15));
  dt.setUTCMonth(dt.getUTCMonth() + 1);
  const y2 = dt.getUTCFullYear();
  const m2 = String(dt.getUTCMonth()+1).padStart(2,"0");
  return `${y2}-${m2}`;
}
function dayOfWeekIndex(yyyy_mm_dd) {
  const [y,m,d] = yyyy_mm_dd.split("-").map(Number);
  const dt = new Date(Date.UTC(y, m-1, d));
  return dt.getUTCDay(); // 0=Dom..6=Sáb
}
function daysInMonth(yyyy_mm) {
  const [y,m] = yyyy_mm.split("-").map(Number);
  return new Date(Date.UTC(y, m, 0)).getUTCDate();
}
function cleanDigits(v) { return (v || "").replace(/[^\d]/g, ""); }
function cleanDni(v) { return (v || "").trim().replace(/[.\s-]/g, ""); }

function fmtHora(inicio_slot) {
  return new Date(inicio_slot).toLocaleTimeString("es-AR", {
    timeZone: AR_TZ, hour:"2-digit", minute:"2-digit"
  });
}

function openModal() { modalBack.style.display = "flex"; }
function closeModal() { modalBack.style.display = "none"; }

/* ================= STATE ================= */
let MEDICO_ID = null;
let medicoNombre = null;
let medicoEsp = null;
let medicoHorizonte = 30;
let medicoDuracion = 15;

let availableDaysSet = new Set();
let selectedDateISO = null;
window.SLOT_SELECCIONADO = null;

/* ================= CHECKBOX LOGIC ================= */
chkNoEmail.addEventListener("change", () => {
  if (chkNoEmail.checked) {
    inEmail.value = "";
    inEmail.disabled = true;
  } else {
    inEmail.disabled = false;
  }
});

chkParticular.addEventListener("change", () => {
  if (chkParticular.checked) {
    inOS.value = "PARTICULAR";
    inOS.disabled = true;

    inAf.value = "";
    inAf.disabled = true;
  } else {
    inOS.disabled = false;
    inAf.disabled = false;
    // opcional: si quedó PARTICULAR, lo borramos para obligar a completar
    if ((inOS.value || "").trim().toUpperCase() === "PARTICULAR") inOS.value = "";
  }
});

/* ================= RESOLVE MEDICO (id o slug) ================= */
async function resolveMedico() {
  daysErr.textContent = "";

  if (MEDICO_ID_QS) {
    MEDICO_ID = MEDICO_ID_QS;
    return;
  }

  if (!SLUG_QS) {
    daysErr.textContent = "Falta medico_id o m (slug) en la URL.";
    throw new Error("Missing medico identifier");
  }

  const { data, error } = await sb
    .from("Medicos")
    .select("id")
    .eq("slug", SLUG_QS)
    .maybeSingle();

  if (error || !data?.id) {
    daysErr.textContent = "No se encontró el médico por slug.";
    throw new Error("Slug not found");
  }

  MEDICO_ID = data.id;
}

/* ================= LOAD MEDICO DATA ================= */
async function cargarMedico() {
  const { data, error } = await sb
    .from("Medicos")
    .select("Nombre, especialidad, horizonte_dias, duracion_min")
    .eq("id", MEDICO_ID)
    .maybeSingle();

  if (error || !data) return;

  medicoNombre = data.Nombre || null;
  medicoEsp = data.especialidad || null;
  medicoHorizonte = Number.isFinite(Number(data.horizonte_dias)) ? Number(data.horizonte_dias) : 30;
  medicoDuracion = Number.isFinite(Number(data.duracion_min)) ? Number(data.duracion_min) : 15;

  if (medicoNombre) medicoLine.textContent = "Médico: " + medicoNombre;
  if (medicoEsp) espLine.textContent = medicoEsp;
  horizonLine.textContent = `Próximos ${medicoHorizonte} días`;
}

/* ================= RPC: DIAS ================= */
async function cargarDias() {
  daysErr.textContent = "";
  calBox.innerHTML = "";

  const hoy = new Date();
  const desde = isoDateAR(hoy);
  const hasta = addDaysISO(desde, medicoHorizonte);

  const { data, error } = await sb.rpc("get_dias_con_slots", {
    p_medico_id: MEDICO_ID,
    p_desde: desde,
    p_hasta: hasta
  });

  if (error) {
    console.error(error);
    daysErr.textContent = error.message;
    return;
  }

  if (!data || data.length === 0) {
    daysErr.textContent = "No hay días con disponibilidad en el rango.";
    return;
  }

  availableDaysSet = new Set(data.map(r => r.dia));

  // Render todos los meses entre desde..hasta
  let mk = monthKey(desde);
  const endMk = monthKey(hasta);
  while (true) {
    renderMonth(mk, desde, hasta);
    if (mk === endMk) break;
    mk = nextMonthKey(mk);
    // safety: por si algo raro
    if (!mk) break;
  }

  selectDay(data[0].dia);
}

/* ================= CALENDAR RENDER ================= */
function renderMonth(yyyy_mm, desdeISO, hastaISO) {
  const monthDiv = document.createElement("div");
  monthDiv.className = "month";

  const [y,m] = yyyy_mm.split("-").map(Number);
  const monthName = new Intl.DateTimeFormat("es-AR", { timeZone: AR_TZ, month:"long", year:"numeric" })
    .format(new Date(Date.UTC(y, m-1, 15, 12, 0, 0)));

  const title = document.createElement("div");
  title.className = "monthTitle";
  title.textContent = monthName[0].toUpperCase() + monthName.slice(1);
  monthDiv.appendChild(title);

  const dow = document.createElement("div");
  dow.className = "dow";
  ["L","M","M","J","V","S","D"].forEach(x => {
    const d = document.createElement("div");
    d.textContent = x;
    dow.appendChild(d);
  });
  monthDiv.appendChild(dow);

  const grid = document.createElement("div");
  grid.className = "daysGrid";

  const firstISO = `${yyyy_mm}-01`;
  const firstDowSun0 = dayOfWeekIndex(firstISO);
  const firstDowMon0 = (firstDowSun0 + 6) % 7; // lunes=0

  for (let i=0;i<firstDowMon0;i++) {
    const b = document.createElement("button");
    b.className = "dayCell empty";
    b.disabled = true;
    grid.appendChild(b);
  }

  const dim = daysInMonth(yyyy_mm);
  for (let day=1; day<=dim; day++) {
    const dd = String(day).padStart(2,"0");
    const iso = `${yyyy_mm}-${dd}`;

    const btn = document.createElement("button");
    btn.className = "dayCell";
    btn.textContent = String(day);

    const inRange = (iso >= desdeISO && iso <= hastaISO);
    if (inRange) btn.classList.add("inRange");

    const has = availableDaysSet.has(iso);
    btn.disabled = !(inRange && has);

    btn.onclick = () => selectDay(iso);
    btn.dataset.iso = iso;

    grid.appendChild(btn);
  }

  monthDiv.appendChild(grid);
  calBox.appendChild(monthDiv);
}

function selectDay(iso) {
  selectedDateISO = iso;

  document.querySelectorAll(".dayCell").forEach(b => {
    if (b.dataset?.iso) b.classList.toggle("active", b.dataset.iso === iso);
  });

  dayTitle.textContent = "Horarios · " + fmtDMY(iso);
  cargarSlots(iso);
}

/* ================= RPC: SLOTS ================= */
async function cargarSlots(fechaISO) {
  errSlots.textContent = "";
  slotsBox.innerHTML = "";
  chosenSlot.textContent = "—";
  btnBook.disabled = true;
  window.SLOT_SELECCIONADO = null;

  const { data, error } = await sb.rpc("get_slots_dia", {
    p_medico_id: MEDICO_ID,
    p_fecha: fechaISO
  });

  if (error) {
    console.error(error);
    errSlots.textContent = error.message;
    return;
  }
  if (!data || data.length === 0) {
    errSlots.textContent = "Ese día no tiene horarios.";
    return;
  }

  data.forEach(s => {
    const hora = fmtHora(s.inicio_slot);

    const btn = document.createElement("button");
    btn.className = "slotbtn";
    btn.textContent = hora;

    btn.onclick = () => {
      document.querySelectorAll(".slotbtn").forEach(x => x.classList.remove("active"));
      btn.classList.add("active");

      chosenSlot.textContent = `${fmtDMY(fechaISO)} ${hora}`;
      window.SLOT_SELECCIONADO = s;
      btnBook.disabled = false;
    };

    slotsBox.appendChild(btn);
  });
}

/* ================= BOOKING (RPC largo) ================= */
btnBook.onclick = async () => {
  errBook.textContent = "";
  okBook.textContent = "";

  const slot = window.SLOT_SELECCIONADO;
  if (!slot || !selectedDateISO) return;

  const nombre = document.getElementById("nombre").value.trim();
  const dni = cleanDni(document.getElementById("dni").value.trim());
  const telefono = cleanDigits(document.getElementById("telefono").value.trim());

  let email = (document.getElementById("email").value || "").trim();
  let obra_social = (document.getElementById("obra_social").value || "").trim();
  let numero_afiliado = (document.getElementById("numero_afiliado").value || "").trim();

  // reglas de checkboxes
  if (chkNoEmail.checked) email = "";
  if (chkParticular.checked) {
    obra_social = "PARTICULAR";
    numero_afiliado = "";
  }

  // VALIDACIONES (obligatorio salvo excepciones)
  if (!nombre || !dni || !telefono) {
    errBook.textContent = "Completá nombre, DNI y teléfono.";
    return;
  }
  if (!chkNoEmail.checked && !email) {
    errBook.textContent = "Completá el email (o marcá 'No tengo mail').";
    return;
  }
  if (!obra_social) {
    errBook.textContent = "Completá la obra social (o marcá 'Sin obra social').";
    return;
  }
  if (!chkParticular.checked && !numero_afiliado) {
    errBook.textContent = "Completá el N° de afiliado (o marcá 'Sin obra social').";
    return;
  }

  btnBook.disabled = true;

  try {
    const token = crypto.randomUUID().replaceAll("-", "");

    const { data, error } = await sb.rpc("reservar_turno", {
      p_medico_id: MEDICO_ID,
      p_dni: dni,
      p_nombre: nombre,
      p_inicio: slot.inicio_slot,
      p_duracion_min: medicoDuracion,
      p_manage_token: token,
      p_canal: "web",
      p_obra_social: obra_social || null,
      p_numero_afiliado: numero_afiliado || null,
      p_email: (email || null),
      p_telefono: (telefono || null)
    });

    if (error) {
      console.error(error);
      errBook.textContent = error.message;
      btnBook.disabled = false;
      return;
    }

    // Mostrar checkout modal
    const fecha = fmtDMY(selectedDateISO);
    const hora = fmtHora(slot.inicio_slot);

    const resumen = [
      ["Médico", medicoNombre || "—"],
      ["Especialidad", medicoEsp || "—"],
      ["Fecha", fecha],
      ["Hora", hora],
      ["Paciente", nombre],
      ["DNI", dni],
      ["Teléfono", telefono],
      ["Email", chkNoEmail.checked ? "—" : (email || "—")],
      ["Obra social", obra_social],
      ["N° afiliado", chkParticular.checked ? "—" : (numero_afiliado || "—")],
      ["Código", token] // útil para soporte / auditoría
    ];

    kvBox.innerHTML = "";
    resumen.forEach(([k,v]) => {
      const div = document.createElement("div");
      div.innerHTML = `<b>${k}</b>${String(v)}`;
      kvBox.appendChild(div);
    });

    // Texto para compartir/copiar
    const shareText =
`ENDO Medicina - Confirmación de turno
Médico: ${medicoNombre || "-"} (${medicoEsp || "-"})
Fecha: ${fecha}  Hora: ${hora}
Paciente: ${nombre}  DNI: ${dni}
Tel: ${telefono}
${chkNoEmail.checked ? "" : ("Email: " + email + "\n")}
Obra social: ${obra_social}
${chkParticular.checked ? "" : ("Afiliado: " + numero_afiliado + "\n")}
Código: ${token}`;

    btnShare.onclick = async () => {
      try {
        if (navigator.share) {
          await navigator.share({ title: "Confirmación de turno", text: shareText });
        } else {
          await navigator.clipboard.writeText(shareText);
          btnShare.textContent = "Copiado ✅";
          setTimeout(()=> btnShare.textContent = "Compartir / Copiar", 1500);
        }
      } catch(e) {
        try {
          await navigator.clipboard.writeText(shareText);
          btnShare.textContent = "Copiado ✅";
          setTimeout(()=> btnShare.textContent = "Compartir / Copiar", 1500);
        } catch(_) {}
      }
    };

    btnPrint.onclick = () => window.print();

    btnClose.onclick = () => {
      // recarga para volver “home” limpio (ideal para tótem)
      window.location.reload();
    };

    openModal();

    // refrescar slots para que desaparezca el tomado
    await cargarSlots(selectedDateISO);

    // limpieza de form (por seguridad)
    ["nombre","dni","telefono","email","obra_social","numero_afiliado"].forEach(id => {
      const el = document.getElementById(id);
      if (el && !el.disabled) el.value = "";
    });

    chosenSlot.textContent = "—";
    window.SLOT_SELECCIONADO = null;

  } catch (e) {
    console.error(e);
    errBook.textContent = "Error inesperado. Revisá consola.";
    btnBook.disabled = false;
  }
};

/* ================= INIT ================= */
document.getElementById("tzPill").textContent = "TZ: AR (Buenos Aires)";

(async function init(){
  await resolveMedico();
  await cargarMedico();
  await cargarDias();
})();
</script>
</body>
</html>
