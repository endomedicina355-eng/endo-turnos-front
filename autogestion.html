<!-- autogestion.html (PUBLICO: ?t=tenantSlug&m=medicoSlug o ?medico_id=... ; usa config.js, NO hardcode) -->
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Turnos online</title>

  <style>
  :root{
    --primary:#111111;
    --bg:#f6f7f8;
    --card:#ffffff;
    --border:#e7e7e7;
    --muted:#666;
    --danger:#b00020;
    --ok:#0a7a27;
    --selBg: rgba(17,17,17,.10);
    --selBorder:#111;
  }

  body{
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
    margin:0;
    background:var(--bg);
    color:#111;
  }

  .wrap{
    max-width:980px;
    margin:0 auto;
    padding:18px;
  }

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
    margin:12px 0;
  }

  .header{
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:flex-start;
  }

  .brand{
    font-weight:900;
    font-size:20px;
    line-height:1.1;
  }

  .muted{
    color:var(--muted);
    font-size:13px;
  }

  .pill{
    display:inline-block;
    padding:6px 10px;
    border-radius:999px;
    border:1px solid #ddd;
    font-size:12px;
    background:#fff;
  }

  #medicoLine{
    font-size:16px;
    font-weight:800;
    color:#111;
    margin-top:6px;
  }

  #espLine{
    font-size:14px;
    font-weight:700;
    color:#333;
    margin-top:2px;
  }

  .grid{
    display:grid;
    grid-template-columns:1fr;
    gap:12px;
  }

  @media(min-width:900px){
    .grid{
      grid-template-columns:1.1fr .9fr;
    }
  }

  .calWrap{
    display:grid;
    gap:12px;
  }

  @media(min-width:740px){
    .calWrap{
      grid-template-columns:1fr 1fr;
    }
  }

  .month{
    border:1px solid #eee;
    border-radius:14px;
    padding:12px;
  }

  .monthTitle{
    font-weight:900;
    margin:0 0 8px 0;
  }

  .dow{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
    margin-bottom:6px;
  }

  .dow div{
    font-size:12px;
    color:#777;
    text-align:center;
  }

  .daysGrid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
  }

  .dayCell{
    height:38px;
    border-radius:12px;
    border:1px solid #eee;
    background:#fff;
    cursor:pointer;
    font-size:13px;
    transition:
      transform .05s ease,
      box-shadow .15s ease,
      background .15s ease,
      border-color .15s ease;
  }

  .dayCell:hover:not(:disabled){
    box-shadow:0 2px 10px rgba(0,0,0,.06);
    transform:translateY(-1px);
  }

  .dayCell:disabled{
    opacity:.35;
    cursor:not-allowed;
    background:#fafafa;
  }

  .dayCell.inRange{
    border-color:#ddd;
  }

  .dayCell.empty{
    border:0;
    background:transparent;
    cursor:default;
    box-shadow:none;
  }

  .dayCell.active{
    background: var(--selBg);
    border-color: var(--selBorder);
    box-shadow: 0 0 0 2px rgba(17,17,17,.12);
    font-weight:900;
  }

  .slots{
    display:grid;
    grid-template-columns:repeat(3, minmax(0,1fr));
    gap:8px;
  }

  @media(max-width:520px){
    .slots{
      grid-template-columns:repeat(2, minmax(0,1fr));
    }
  }

  .slotbtn{
    border:1px solid #ddd;
    background:#fff;
    border-radius:12px;
    padding:10px;
    cursor:pointer;
    text-align:center;
    font-weight:700;
  }

  .slotbtn.active{
    border-color:var(--primary);
    box-shadow:0 0 0 2px rgba(17,17,17,.10);
    font-weight:900;
  }

  /* ===== FORM NUEVO ===== */

  .formGrid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:12px;
  }

  @media(max-width:700px){
    .formGrid{
      grid-template-columns:1fr;
    }
  }

  .field label{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin-bottom:5px;
    font-weight:700;
  }

  input{
    width:100%;
    padding:10px 12px;
    border-radius:12px;
    border:1px solid #ddd;
    font-size:14px;
    background:#fff;
    box-sizing:border-box;
  }

  input:disabled{
    background:#f5f5f5;
    color:#888;
  }

  button.primary{
    background:var(--primary);
    color:#fff;
    border:0;
    border-radius:12px;
    padding:12px 14px;
    font-weight:900;
    cursor:pointer;
    width:100%;
    margin-top:12px;
  }

  button.primary:disabled{
    opacity:.45;
  }

  .error{
    color:var(--danger);
    font-size:13px;
  }

  .ok{
    color:var(--ok);
    font-size:13px;
  }

  .checks{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    margin-top:14px;
  }

  .checkItem{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:#333;
    font-weight:600;
  }

  .checkItem input{
    width:auto;
  }

  /* ===== MODAL ===== */

  .modalBack{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
    z-index:9999;
  }

  .modal{
    width:min(560px, 100%);
    background:#fff;
    border-radius:16px;
    border:1px solid var(--border);
    padding:16px;
    box-shadow:0 10px 40px rgba(0,0,0,.25);
  }

  .modal h3{
    margin:0 0 6px 0;
  }

  .kv{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:12px;
  }

  .kv div{
    border:1px solid #eee;
    border-radius:12px;
    padding:10px;
  }

  .kv b{
    display:block;
    font-size:12px;
    color:#666;
    margin-bottom:4px;
  }

  .modalBtns{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  margin-top:12px;
}

@media(max-width:520px){
  .modalBtns{
    grid-template-columns:1fr;
  }
}

  .btnGhost,
  .btnDanger{
    background:#fff;
    border:1px solid #ddd;
    border-radius:12px;
    padding:12px 14px;
    font-weight:900;
    cursor:pointer;
    width:100%;
  }
</style>
</head>

<body>

</div>

  <div class="card">
  <div style="font-weight:900">Consultar próximo turno</div>

<div class="modalBack" id="modalBack">

    <div class="kv" id="kvBox"></div>

    <div class="modalBtns">
      <button class="btnGhost" id="btnShare">Compartir / Copiar</button>
      <button class="btnGhost" id="btnPrint">Imprimir</button>
      <button class="btnDanger" id="btnClose">Cerrar</button>

<script src="./config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ================= CONFIG (NO hardcode) ================= */
const SUPABASE_URL = window.__SB__?.url;
const SUPABASE_ANON_KEY = window.__SB__?.anonKey;
if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
  alert("Falta config.js (window.__SB__).");
  throw new Error("Missing Supabase config");
}
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ================= PARAMS ================= */
const params = new URLSearchParams(window.location.search);
const TENANT_SLUG_QS = (params.get("t") || "").trim();     // ✅ requerido
const MEDICO_ID_QS   = (params.get("medico_id") || "").trim();
const SLUG_QS        = (params.get("m") || "").trim();     // slug médico

/* ================= DOM ================= */
const medicoLine   = document.getElementById("medicoLine");
const espLine      = document.getElementById("espLine");
const horizonLine  = document.getElementById("horizonLine");
const calBox       = document.getElementById("calendar");
const daysErr      = document.getElementById("errDays");

const slotsBox     = document.getElementById("slots");
const errSlots     = document.getElementById("errSlots");
const dayTitle     = document.getElementById("dayTitle");
const chosenSlot   = document.getElementById("chosenSlot");

const btnBook      = document.getElementById("btnBook");
const errBook      = document.getElementById("errBook");
const okBook       = document.getElementById("okBook");

const chkNoEmail = { checked:false, addEventListener:()=>{} };
const chkParticular= document.getElementById("chkParticular");
const inEmail      = document.getElementById("email");
const inOS         = document.getElementById("obra_social");
const inAf         = document.getElementById("numero_afiliado");

const tenantTitle = document.getElementById("tenantTitle");
const tenantSubtitle = document.getElementById("tenantSubtitle");

const modalBack = document.getElementById("modalBack");
const kvBox     = document.getElementById("kvBox");
const btnShare  = document.getElementById("btnShare");
const btnPrint  = document.getElementById("btnPrint");
const btnClose  = document.getElementById("btnClose");
const consultaDni = document.getElementById("consultaDni");
const consultaApellido = document.getElementById("consultaApellido");
const btnConsultarTurno = document.getElementById("btnConsultarTurno");
const consultaErr = document.getElementById("consultaErr");
const consultaResultado = document.getElementById("consultaResultado");  

/* ================= HELPERS (AR TZ) ================= */
const AR_TZ = "America/Argentina/Buenos_Aires";

function isoDateAR(d) {
  const parts = new Intl.DateTimeFormat("en-CA", { timeZone: AR_TZ, year:"numeric", month:"2-digit", day:"2-digit"}).formatToParts(d);
  const y = parts.find(p=>p.type==="year").value;
  const m = parts.find(p=>p.type==="month").value;
  const da = parts.find(p=>p.type==="day").value;
  return `${y}-${m}-${da}`;
}
function fmtDMY(yyyy_mm_dd) {
  const [y,m,d] = yyyy_mm_dd.split("-");
  return `${d}/${m}/${y}`;
}
function addDaysISO(yyyy_mm_dd, n) {
  const [y,m,d] = yyyy_mm_dd.split("-").map(Number);
  const dt = new Date(Date.UTC(y, m-1, d));
  dt.setUTCDate(dt.getUTCDate() + n);
  const y2 = dt.getUTCFullYear();
  const m2 = String(dt.getUTCMonth()+1).padStart(2,"0");
  const d2 = String(dt.getUTCDate()).padStart(2,"0");
  return `${y2}-${m2}-${d2}`;
}
function monthKey(yyyy_mm_dd) { return yyyy_mm_dd.slice(0,7); }
function nextMonthKey(yyyy_mm) {
  const [y,m] = yyyy_mm.split("-").map(Number);
  const dt = new Date(Date.UTC(y, m-1, 15));
  dt.setUTCMonth(dt.getUTCMonth() + 1);
  const y2 = dt.getUTCFullYear();
  const m2 = String(dt.getUTCMonth()+1).padStart(2,"0");
  return `${y2}-${m2}`;
}
function dayOfWeekIndex(yyyy_mm_dd) {
  const [y,m,d] = yyyy_mm_dd.split("-").map(Number);
  const dt = new Date(Date.UTC(y, m-1, d));
  return dt.getUTCDay(); // 0=Dom..6=Sáb
}
function daysInMonth(yyyy_mm) {
  const [y,m] = yyyy_mm.split("-").map(Number);
  return new Date(Date.UTC(y, m, 0)).getUTCDate();
}
function cleanDigits(v) { return (v || "").replace(/[^\d]/g, ""); }
function cleanDni(v) { return (v || "").trim().replace(/[.\s-]/g, ""); }

function fmtHora(inicio_slot) {
  return new Date(inicio_slot).toLocaleTimeString("es-AR", {
    timeZone: AR_TZ,
    hour:"2-digit",
    minute:"2-digit",
    hour12:false
  });
}
function openModal() { modalBack.style.display = "flex"; }
function closeModal() { modalBack.style.display = "none"; }

/* ================= STATE ================= */
let TENANT_ID = null;
let MEDICO_ID = null;

let medicoNombre = null;
let medicoEsp = null;
let medicoHorizonte = 30;
let medicoDuracion = 15;

let availableDaysSet = new Set();
let selectedDateISO = null;
let SLOTS_RANGO = [];
let SLOTS_POR_DIA = {};  
window.SLOT_SELECCIONADO = null;

/* ================= CHECKBOX LOGIC ================= */
chkNoEmail.addEventListener("change", () => {
  if (chkNoEmail.checked) {
    inEmail.value = "";
    inEmail.disabled = true;
  } else {
    inEmail.disabled = false;
  }
});

chkParticular.addEventListener("change", () => {
  if (chkParticular.checked) {
    inOS.value = "PARTICULAR";
    inOS.disabled = true;

    inAf.value = "";
    inAf.disabled = true;
  } else {
    inOS.disabled = false;
    inAf.disabled = false;
    if ((inOS.value || "").trim().toUpperCase() === "PARTICULAR") inOS.value = "";
  }
});

/* ================= TENANT: por slug en URL ================= */
async function resolveTenant(){
  daysErr.textContent = "";

  if (!TENANT_SLUG_QS){
    daysErr.textContent = "Falta t (clínica) en la URL. Ej: ?t=endo&m=dr-xxx";
    throw new Error("Missing tenant slug");
  }

  const { data, error } = await sb
    .from("Tenants")
    .select("id,nombre,theme,color_primario,color_secundario,logo_url,logo_alt")
    .eq("slug", TENANT_SLUG_QS)
    .eq("activo", true)
    .maybeSingle();

  if (error || !data?.id){
    daysErr.textContent = "No se encontró la clínica (tenant).";
    throw new Error("Tenant not found");
  }

  TENANT_ID = data.id;

  const title = data?.theme?.header?.title || data.nombre || "Turnos online";
  const subtitle = data?.theme?.header?.subtitle || "Reservá tu turno";
  tenantTitle.textContent = title;
  tenantSubtitle.textContent = subtitle;

  const primary = data.color_primario || "#111111";
  const bg = data.color_secundario || "#f6f7f8";
  document.documentElement.style.setProperty("--primary", primary);
  document.documentElement.style.setProperty("--selBorder", primary);
  document.documentElement.style.setProperty("--selBg", `${primary}1A`);
  document.documentElement.style.setProperty("--bg", bg);

  document.title = title + " · Turnos";
}

/* ================= MEDICO: id o slug, SIEMPRE filtrado por tenant ================= */
async function resolveMedico() {
  daysErr.textContent = "";

  if (MEDICO_ID_QS) {
    const { data, error } = await sb
      .from("Medicos")
      .select("id")
      .eq("id", MEDICO_ID_QS)
      .eq("tenant_id", TENANT_ID)
      .eq("activo", true)
      .maybeSingle();

    if (error || !data?.id) {
      daysErr.textContent = "El médico no pertenece a esta clínica (o está inactivo).";
      throw new Error("Medico invalid");
    }

    MEDICO_ID = data.id;
    return;
  }

  if (!SLUG_QS) {
    daysErr.textContent = "Falta m (slug del médico) en la URL. Ej: ?t=endo&m=dr-xxx";
    throw new Error("Missing medico slug");
  }

  const { data, error } = await sb
    .from("Medicos")
    .select("id")
    .eq("slug", SLUG_QS)
    .eq("tenant_id", TENANT_ID)
    .eq("activo", true)
    .maybeSingle();

  if (error || !data?.id) {
    daysErr.textContent = "No se encontró el médico en esta clínica (o está inactivo).";
    throw new Error("Medico slug not found");
  }

  MEDICO_ID = data.id;
}

/* ================= LOAD MEDICO DATA ================= */
async function cargarMedico() {
  const { data, error } = await sb
    .from("Medicos")
    .select(' "Nombre", especialidad, horizonte_dias, duracion_min ')
    .eq("id", MEDICO_ID)
    .eq("tenant_id", TENANT_ID)
    .maybeSingle();

  if (error || !data) return;

  medicoNombre = data["Nombre"] || null;
  medicoEsp = data.especialidad || null;
  medicoHorizonte = Number.isFinite(Number(data.horizonte_dias)) ? Number(data.horizonte_dias) : 30;
  medicoDuracion = Number.isFinite(Number(data.duracion_min)) ? Number(data.duracion_min) : 15;

  medicoLine.textContent = "Médico: " + (medicoNombre || "—");
  espLine.textContent = medicoEsp ? medicoEsp : "";
  horizonLine.textContent = `Próximos ${medicoHorizonte} días`;
}

/* ================= RPC: DIAS ================= */
async function cargarDias() {
  daysErr.textContent = "";
  calBox.innerHTML = "";
  slotsBox.innerHTML = "";
  errSlots.textContent = "";
  chosenSlot.textContent = "—";
  btnBook.disabled = true;
  window.SLOT_SELECCIONADO = null;

  const hoy = new Date();
  const desde = isoDateAR(hoy);
  const hasta = addDaysISO(desde, medicoHorizonte);

  const { data, error } = await sb.rpc("get_slots_disponibles_rango", {
    p_medico_id: MEDICO_ID,
    p_desde: desde,
    p_hasta: hasta
  });

  if (error) {
    daysErr.textContent = error.message;
    return;
  }

  SLOTS_RANGO = data || [];
  SLOTS_POR_DIA = {};

  SLOTS_RANGO.forEach(s => {
    const dia = s.dia;
    if (!SLOTS_POR_DIA[dia]) SLOTS_POR_DIA[dia] = [];
    SLOTS_POR_DIA[dia].push(s);
  });

  availableDaysSet = new Set(Object.keys(SLOTS_POR_DIA));

  if (!availableDaysSet.size) {
    daysErr.textContent = "No hay turnos disponibles en el rango.";
    return;
  }

  let mk = monthKey(desde);
  const endMk = monthKey(hasta);

  while (true) {
    renderMonth(mk, desde, hasta);
    if (mk === endMk) break;
    mk = nextMonthKey(mk);
    if (!mk) break;
  }

  selectDay(Object.keys(SLOTS_POR_DIA)[0]);
}
/* ================= CALENDAR RENDER ================= */
function renderMonth(yyyy_mm, desdeISO, hastaISO) {
  const monthDiv = document.createElement("div");
  monthDiv.className = "month";

  const [y,m] = yyyy_mm.split("-").map(Number);
  const monthName = new Intl.DateTimeFormat("es-AR", { timeZone: AR_TZ, month:"long", year:"numeric" })
    .format(new Date(Date.UTC(y, m-1, 15, 12, 0, 0)));

  const title = document.createElement("div");
  title.className = "monthTitle";
  title.textContent = monthName[0].toUpperCase() + monthName.slice(1);
  monthDiv.appendChild(title);

  const dow = document.createElement("div");
  dow.className = "dow";
  ["L","M","M","J","V","S","D"].forEach(x => {
    const d = document.createElement("div");
    d.textContent = x;
    dow.appendChild(d);
  });
  monthDiv.appendChild(dow);

  const grid = document.createElement("div");
  grid.className = "daysGrid";

  const firstISO = `${yyyy_mm}-01`;
  const firstDowSun0 = dayOfWeekIndex(firstISO);
  const firstDowMon0 = (firstDowSun0 + 6) % 7; // lunes=0

  for (let i=0;i<firstDowMon0;i++) {
    const b = document.createElement("button");
    b.className = "dayCell empty";
    b.disabled = true;
    grid.appendChild(b);
  }

  const dim = daysInMonth(yyyy_mm);
  for (let day=1; day<=dim; day++) {
    const dd = String(day).padStart(2,"0");
    const iso = `${yyyy_mm}-${dd}`;

    const btn = document.createElement("button");
    btn.className = "dayCell";
    btn.textContent = String(day);

    const inRange = (iso >= desdeISO && iso <= hastaISO);
    if (inRange) btn.classList.add("inRange");

    const has = availableDaysSet.has(iso);
    btn.disabled = !(inRange && has);

    btn.onclick = () => selectDay(iso);
    btn.dataset.iso = iso;

    grid.appendChild(btn);
  }

  monthDiv.appendChild(grid);
  calBox.appendChild(monthDiv);
}

function selectDay(iso) {
  selectedDateISO = iso;

  document.querySelectorAll(".dayCell").forEach(b => {
    if (b.dataset?.iso) b.classList.toggle("active", b.dataset.iso === iso);
  });

  dayTitle.textContent = "Horarios · " + fmtDMY(iso);
  cargarSlots(iso);
}

/* ================= RPC: SLOTS ================= */
async function cargarSlots(fechaISO) {
  errSlots.textContent = "";
  slotsBox.innerHTML = "";
  chosenSlot.textContent = "—";
  btnBook.disabled = true;
  window.SLOT_SELECCIONADO = null;

  const data = SLOTS_POR_DIA[fechaISO] || [];

  if (!data.length) {
    errSlots.textContent = "Ese día no tiene horarios disponibles.";
    return;
  }

  data.forEach(s => {
    const hora = fmtHora(s.inicio_slot);

    const btn = document.createElement("button");
    btn.className = "slotbtn";
    btn.textContent = hora;

    btn.onclick = () => {
      document.querySelectorAll(".slotbtn").forEach(x => x.classList.remove("active"));
      btn.classList.add("active");

      chosenSlot.textContent = `${fmtDMY(fechaISO)} ${hora}`;
      window.SLOT_SELECCIONADO = s;
      btnBook.disabled = false;
    };

    slotsBox.appendChild(btn);
  });
}
  /* ================= BOOKING ================= */
btnBook.onclick = async () => {
  errBook.textContent = "";
  okBook.textContent = "";

  const slot = window.SLOT_SELECCIONADO;
  if (!slot || !selectedDateISO) return;

  const nombre = document.getElementById("nombre").value.trim();
  const dni = cleanDni(document.getElementById("dni").value.trim());
  const telefono = cleanDigits(document.getElementById("telefono").value.trim());

  let email = (document.getElementById("email").value || "").trim();
  let obra_social = (document.getElementById("obra_social").value || "").trim();
  let numero_afiliado = (document.getElementById("numero_afiliado").value || "").trim();

  if (chkNoEmail.checked) email = "";
  if (chkParticular.checked) {
    obra_social = "PARTICULAR";
    numero_afiliado = "";
  }

  if (!nombre || !dni || !telefono) {
    errBook.textContent = "Completá nombre, DNI y teléfono.";
    return;
  }
  if (!email) {
  errBook.textContent = "Completá el email. Es necesario para recibir la confirmación y gestionar el turno.";
  return;
}
  if (!obra_social) {
    errBook.textContent = "Completá la obra social (o marcá 'Sin obra social').";
    return;
  }
  if (!chkParticular.checked && !numero_afiliado) {
    errBook.textContent = "Completá el N° de afiliado (o marcá 'Sin obra social').";
    return;
  }

  btnBook.disabled = true;

  try {
    const token = crypto.randomUUID().replaceAll("-", "");

    const { data: nuevoTurnoId, error } = await sb.rpc("reservar_turno", {
      p_medico_id: MEDICO_ID,
      p_dni: dni,
      p_nombre: nombre,
      p_inicio: slot.inicio_slot,
      p_duracion_min: medicoDuracion,
      p_manage_token: token,
      p_canal: "web",
      p_obra_social: obra_social || null,
      p_numero_afiliado: numero_afiliado || null,
      p_email: (email || null),
      p_telefono: (telefono || null)
    });

    if (error) {
      errBook.textContent = error.message;
      btnBook.disabled = false;
      return;
    }
    try {
  if (nuevoTurnoId) {
    await fetch(`${SUPABASE_URL}/functions/v1/send-turno-email`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        turno_id: nuevoTurnoId
      })
    });
  }
} catch (e) {
  console.warn("No se pudo enviar mail de confirmación", e);
}

    const fecha = fmtDMY(selectedDateISO);
    const hora = fmtHora(slot.inicio_slot);

    const resumen = [
      ["Clínica", tenantTitle.textContent],
      ["Médico", medicoNombre || "—"],
      ["Especialidad", medicoEsp || "—"],
      ["Fecha", fecha],
      ["Hora", hora],
      ["Paciente", nombre],
      ["DNI", dni],
      ["Teléfono", telefono],
      ["Email", chkNoEmail.checked ? "—" : (email || "—")],
      ["Obra social", obra_social],
      ["N° afiliado", chkParticular.checked ? "—" : (numero_afiliado || "—")]
    ];

    kvBox.innerHTML = "";
    resumen.forEach(([k,v]) => {
      const div = document.createElement("div");
      div.innerHTML = `<b>${k}</b>${String(v)}`;
      kvBox.appendChild(div);
    });

    const shareText =
`${tenantTitle.textContent} - Confirmación de turno
Médico: ${medicoNombre || "-"} (${medicoEsp || "-"})
Fecha: ${fecha}  Hora: ${hora}
Paciente: ${nombre}  DNI: ${dni}
Tel: ${telefono}
${chkNoEmail.checked ? "" : ("Email: " + email + "\n")}
Obra social: ${obra_social}
${chkParticular.checked ? "" : ("Afiliado: " + numero_afiliado + "\n")}`;

    btnShare.onclick = async () => {
      try {
        if (navigator.share) {
          await navigator.share({ title: "Confirmación de turno", text: shareText });
        } else {
          await navigator.clipboard.writeText(shareText);
          btnShare.textContent = "Copiado ✅";
          setTimeout(()=> btnShare.textContent = "Compartir / Copiar", 1500);
        }
      } catch(e) {
        try {
          await navigator.clipboard.writeText(shareText);
          btnShare.textContent = "Copiado ✅";
          setTimeout(()=> btnShare.textContent = "Compartir / Copiar", 1500);
        } catch(_) {}
      }
    };

    btnPrint.onclick = () => window.print();
    btnClose.onclick = () => window.location.reload();
    openModal();

    await cargarDias();

if (availableDaysSet.has(selectedDateISO)) {
  selectDay(selectedDateISO);
}

    ["nombre","dni","telefono","email","obra_social","numero_afiliado"].forEach(id => {
      const el = document.getElementById(id);
      if (el && !el.disabled) el.value = "";
    });

    chosenSlot.textContent = "—";
    window.SLOT_SELECCIONADO = null;

  } catch (e) {
    errBook.textContent = "Error inesperado. Revisá consola.";
    btnBook.disabled = false;
  }
};

function fmtTurnoConsulta(ts){
  return new Date(ts).toLocaleString("es-AR", {
    timeZone: AR_TZ,
    weekday: "long",
    day: "2-digit",
    month: "2-digit",
    year: "numeric",
    hour: "2-digit",
    minute: "2-digit"
  });
}

btnConsultarTurno.onclick = async () => {
  consultaErr.textContent = "";
  consultaResultado.innerHTML = "";

  const dni = cleanDni(consultaDni.value);
  const apellido = consultaApellido.value.trim();

  if (!dni){
    consultaErr.textContent = "Ingresá DNI.";
    return;
  }

  if (!apellido){
    consultaErr.textContent = "Ingresá apellido.";
    return;
  }

  const { data, error } = await sb.rpc("public_consultar_proximo_turno", {
    p_tenant_id: TENANT_ID,
    p_dni: dni,
    p_apellido: apellido
  });

  if (error){
    consultaErr.textContent = error.message;
    return;
  }

  if (!data || !data.length){
    consultaResultado.innerHTML = `
      <div class="muted">No encontramos turnos futuros con esos datos.</div>
    `;
    return;
  }

  const t = data[0];

  consultaResultado.innerHTML = `
    <div class="card" style="margin:0">
      <div style="font-weight:900">Próximo turno</div>
      <div style="margin-top:10px"><b>${fmtTurnoConsulta(t.inicio)}</b></div>
      <div class="muted">Profesional: <b>${t.medico_nombre || "-"}</b></div>
      <div class="muted">Paciente: <b>${t.paciente_nombre || "-"}</b></div>
      <div class="muted">Obra social: <b>${t.obra_social || "-"}</b></div>
      <div class="muted">Estado: <b>${t.estado || "-"}</b></div>
    </div>
  `;
};  

document.getElementById("tzPill").textContent = "TZ: AR (Buenos Aires)";
