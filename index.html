<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ENDO Medicina · Turnos</title>

  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial; margin:0; background:#f6f7f8; color:#111;}
    .wrap{max-width:980px; margin:0 auto; padding:18px;}
    .card{background:#fff; border:1px solid #e7e7e7; border-radius:14px; padding:16px; margin:12px 0;}
    .header{display:flex; justify-content:space-between; gap:10px; align-items:flex-start;}
    .brand{font-weight:800}
    .muted{color:#666; font-size:13px}
    .pill{display:inline-block; padding:6px 10px; border-radius:999px; border:1px solid #ddd; font-size:12px; background:#fff}

    .grid{display:grid; grid-template-columns:1fr; gap:12px;}
    @media(min-width:900px){ .grid{grid-template-columns:1.1fr .9fr;} }

    /* Calendar */
    .calWrap{display:grid; gap:12px;}
    @media(min-width:740px){ .calWrap{grid-template-columns:1fr 1fr;} }
    .month{border:1px solid #eee; border-radius:14px; padding:12px;}
    .monthTitle{font-weight:800; margin:0 0 8px 0;}
    .dow{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:6px;}
    .dow div{font-size:12px; color:#777; text-align:center;}
    .daysGrid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
    .dayCell{height:38px; border-radius:10px; border:1px solid #eee; background:#fff; cursor:pointer; font-size:13px;}
    .dayCell:disabled{opacity:.35; cursor:not-allowed; background:#fafafa;}
    .dayCell.active{border-color:#111; box-shadow:0 1px 0 rgba(0,0,0,.06)}
    .dayCell.inRange{border-color:#ddd;}
    .dayCell.empty{border:0; background:transparent; cursor:default;}

    .slots{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px}
    @media(max-width:520px){ .slots{grid-template-columns:repeat(2, minmax(0,1fr));} }
    .slotbtn{border:1px solid #ddd; background:#fff; border-radius:12px; padding:10px; cursor:pointer; text-align:center}
    .slotbtn.active{border-color:#111}

    .row{display:grid; gap:10px; grid-template-columns:1fr 1fr}
    @media(max-width:700px){ .row{grid-template-columns:1fr} }
    input{width:100%; padding:10px 12px; border-radius:12px; border:1px solid #ddd; font-size:14px}
    button.primary{background:#111; color:#fff; border:0; border-radius:12px; padding:12px 14px; font-weight:700; cursor:pointer; width:100%}
    button.primary:disabled{opacity:.45}
    .error{color:#b00020; font-size:13px}
    .ok{color:#0a7a27; font-size:13px}
  </style>
</head>

<body>

      <div class="error" id="errBook"></div>
      <div class="ok" id="okBook"></div>

      <button class="primary" id="btnBook" disabled>Confirmar</button>
    </div>
  </div>
</div>

/* ================= HELPERS (AR TZ) ================= */
const AR_TZ = "America/Argentina/Buenos_Aires";

function isoDateAR(d) {
  // retorna YYYY-MM-DD en base a AR (evita corrimientos)
  const parts = new Intl.DateTimeFormat("en-CA", { timeZone: AR_TZ, year:"numeric", month:"2-digit", day:"2-digit"}).formatToParts(d);
  const y = parts.find(p=>p.type==="year").value;
  const m = parts.find(p=>p.type==="month").value;
  const da = parts.find(p=>p.type==="day").value;
  return `${y}-${m}-${da}`;
}
function fmtDMY(yyyy_mm_dd) {
  const [y,m,d] = yyyy_mm_dd.split("-");
  return `${d}/${m}/${y}`;
}
function monthKey(yyyy_mm_dd) { return yyyy_mm_dd.slice(0,7); } // YYYY-MM

function addDaysISO(yyyy_mm_dd, n) {
  // suma días sobre AR TZ sin líos: parse manual
  const [y,m,d] = yyyy_mm_dd.split("-").map(Number);
  const dt = new Date(Date.UTC(y, m-1, d));
  dt.setUTCDate(dt.getUTCDate() + n);
  // volver a YYYY-MM-DD
  const y2 = dt.getUTCFullYear();
  const m2 = String(dt.getUTCMonth()+1).padStart(2,"0");
  const d2 = String(dt.getUTCDate()).padStart(2,"0");
  return `${y2}-${m2}-${d2}`;
}
function dayOfWeekIndex(yyyy_mm_dd) {
  // 0=Sun..6=Sat calculado en UTC (sirve para grilla)
  const [y,m,d] = yyyy_mm_dd.split("-").map(Number);
  const dt = new Date(Date.UTC(y, m-1, d));
  return dt.getUTCDay();
}
function daysInMonth(yyyy_mm) {
  const [y,m] = yyyy_mm.split("-").map(Number);
  return new Date(Date.UTC(y, m, 0)).getUTCDate();
}

/* ================= STATE ================= */
let availableDaysSet = new Set(); // "YYYY-MM-DD" con slots
let selectedDateISO = null;       // "YYYY-MM-DD"

/* ================= LOAD MEDICO (Nombre + Especialidad) ================= */
async function cargarMedico() {
  // OJO: tu columna puede llamarse distinto. Probamos varias (no rompe si no existe).
  // Si en tu tabla ya existe "especialidad" o "Especialidad", dejá una sola en el select.
  const { data, error } = await sb
    .from("Medicos")
    .select('Nombre, especialidad, "Especialidad"')
    .eq("id", MEDICO_ID)
    .maybeSingle();

  if (error) return; // no frena el front

  if (data?.Nombre) medicoLine.textContent = "Médico: " + data.Nombre;

  const esp = data?.especialidad || data?.["Especialidad"];
  if (esp) espLine.textContent = esp;
}

/* ================= RPC: DIAS ================= */
async function cargarDias() {
  daysErr.textContent = "";
  calBox.innerHTML = "";

  const hoy = new Date();
  const desde = isoDateAR(hoy);

  const hasta = addDaysISO(desde, 14);

  const { data, error } = await sb.rpc("get_dias_con_slots", {
    p_medico_id: MEDICO_ID,
    p_desde: desde,
    p_hasta: hasta
  });

  if (error) {
    console.error(error);
    daysErr.textContent = error.message;
    return;
  }

  if (!data || data.length === 0) {
    daysErr.textContent = "No hay días con disponibilidad en los próximos 14 días.";
    return;
  }

  availableDaysSet = new Set(data.map(r => r.dia));

  // render 1 o 2 meses (según rango)
  const startMonth = monthKey(desde);
  const endMonth   = monthKey(hasta);
  renderMonth(startMonth, desde, hasta);
  if (endMonth !== startMonth) renderMonth(endMonth, desde, hasta);

  // auto seleccionar el primer día disponible
  const first = data[0].dia;
  selectDay(first);
}

/* ================= CALENDAR RENDER ================= */
function renderMonth(yyyy_mm, desdeISO, hastaISO) {
  const monthDiv = document.createElement("div");
  monthDiv.className = "month";

  const [y,m] = yyyy_mm.split("-").map(Number);
  const monthName = new Intl.DateTimeFormat("es-AR", { timeZone: AR_TZ, month:"long", year:"numeric" })
    .format(new Date(Date.UTC(y, m-1, 1)));
  const title = document.createElement("div");
  title.className = "monthTitle";
  title.textContent = monthName[0].toUpperCase() + monthName.slice(1);
  monthDiv.appendChild(title);

  const dow = document.createElement("div");
  dow.className = "dow";
  ["L","M","M","J","V","S","D"].forEach(x => {
    const d = document.createElement("div");
    d.textContent = x;
    dow.appendChild(d);
  });
  monthDiv.appendChild(dow);

  const grid = document.createElement("div");
  grid.className = "daysGrid";

  // primer día del mes
  const firstISO = `${yyyy_mm}-01`;
  // Queremos que la semana empiece Lunes. JS UTCDay: 0 Dom..6 Sab
  // Convertimos a índice Lunes=0..Dom=6
  const firstDowSun0 = dayOfWeekIndex(firstISO);
  const firstDowMon0 = (firstDowSun0 + 6) % 7; // Dom->6, Lun->0...

  for (let i=0;i<firstDowMon0;i++) {
    const b = document.createElement("button");
    b.className = "dayCell empty";
    b.disabled = true;
    grid.appendChild(b);
  }

  const dim = daysInMonth(yyyy_mm);
  for (let day=1; day<=dim; day++) {
    const dd = String(day).padStart(2,"0");
    const iso = `${yyyy_mm}-${dd}`;

    const btn = document.createElement("button");
    btn.className = "dayCell";
    btn.textContent = String(day);

    const inRange = (iso >= desdeISO && iso <= hastaISO);
    if (inRange) btn.classList.add("inRange");

    const has = availableDaysSet.has(iso);
    btn.disabled = !(inRange && has);

    btn.onclick = () => selectDay(iso);

    btn.dataset.iso = iso;
    grid.appendChild(btn);
  }

  monthDiv.appendChild(grid);
  calBox.appendChild(monthDiv);
}

function selectDay(iso) {
  selectedDateISO = iso;

  // marcar active
  document.querySelectorAll(".dayCell").forEach(b => {
    if (b.dataset?.iso) b.classList.toggle("active", b.dataset.iso === iso);
  });

  dayTitle.textContent = "Horarios · " + fmtDMY(iso);
  cargarSlots(iso);
}

/* ================= RPC: SLOTS ================= */
async function cargarSlots(fechaISO) {
  errSlots.textContent = "";
  slotsBox.innerHTML = "";
  chosenSlot.textContent = "—";
  btnBook.disabled = true;
  window.SLOT_SELECCIONADO = null;

  const { data, error } = await sb.rpc("get_slots_dia", {
    p_medico_id: MEDICO_ID,
    p_fecha: fechaISO
  });

  if (error) {
    console.error(error);
    errSlots.textContent = error.message;
    return;
  }
  if (!data || data.length === 0) {
    errSlots.textContent = "Ese día no tiene horarios.";
    return;
  }

  data.forEach(s => {
    const hora = new Date(s.inicio_slot).toLocaleTimeString("es-AR", {
      timeZone: AR_TZ,
      hour:"2-digit",
      minute:"2-digit"
    });

    const btn = document.createElement("button");
    btn.className = "slotbtn";
    btn.textContent = hora;

    btn.onclick = () => {
      // marcar active
      document.querySelectorAll(".slotbtn").forEach(x => x.classList.remove("active"));
      btn.classList.add("active");

      chosenSlot.textContent = `${fmtDMY(fechaISO)} ${hora}`;
      window.SLOT_SELECCIONADO = s;
      btnBook.disabled = false;
    };

    slotsBox.appendChild(btn);
  });
}

/* ================= BOOKING ================= */
btnBook.onclick = async () => {

    }, { onConflict: "dni" });

    // 2) Reservar turno (RPC)

  p_canal: "web",
  p_obra_social: document.getElementById("obra_social").value || null,
  p_numero_afiliado: document.getElementById("numero_afiliado").value || null,

});

    if (error) {
      errBook.textContent = error.message;
      btnBook.disabled = false;
      return;
    }

    okBook.textContent = "✅ Turno confirmado.";
    // refrescar slots para que desaparezca el tomado
    await cargarSlots(selectedDateISO);

  } catch (e) {

/* ================= INIT ================= */
document.getElementById("tzPill").textContent = "TZ: AR (Buenos Aires)";
cargarMedico();
cargarDias();
</script>
</body>
