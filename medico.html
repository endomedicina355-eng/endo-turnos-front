<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Agenda médica</title>
  <style>
    :root{--primary:#111;--bg:#f6f7f8;--card:#fff;--border:#e7e7e7;--muted:#666;--danger:#b00020;--ok:#0a7a27}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:#111;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    .wrap{max-width:1180px;margin:0 auto;padding:18px}.header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
    .brand{font-weight:900}.muted{color:var(--muted);font-size:13px}.right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin:12px 0}
    button{border:1px solid #ddd;background:#fff;border-radius:12px;padding:10px 12px;cursor:pointer;font-weight:700}
    button.primary{background:var(--primary);color:#fff;border:0;font-weight:900}button.small{padding:8px 10px;font-size:13px}button:disabled{opacity:.45;cursor:not-allowed}
    .dateNav{display:grid;grid-template-columns:auto minmax(220px,1fr) auto;gap:10px;align-items:center}.dateBox{text-align:center}
    .dateTitle{font-size:20px;font-weight:900}.dateSub{font-size:13px;color:var(--muted);margin-top:3px}
    .kpi{display:grid;grid-template-columns:repeat(6,minmax(115px,1fr));gap:10px;margin-top:14px}.pill{border:1px solid #ddd;border-radius:14px;padding:10px 12px;background:#fff;font-size:12px}.pill b{display:block;font-size:17px;margin-top:3px}
    .error{color:var(--danger);font-size:13px;margin-top:10px}.ok{color:var(--ok);font-size:13px;margin-top:10px}.saving{opacity:.55}
    .tableWrap{overflow:auto}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{padding:10px 8px;border-bottom:1px solid #eee;font-size:14px;vertical-align:middle}th{color:#666;text-align:left;font-size:12px;font-weight:800}
    th:nth-child(1),td:nth-child(1){width:72px}th:nth-child(2),td:nth-child(2){width:175px}th:nth-child(3),td:nth-child(3){width:135px}th:nth-child(4),td:nth-child(4){width:125px}th:nth-child(5),td:nth-child(5){width:165px}th:nth-child(6),td:nth-child(6){width:100px}th:nth-child(7),td:nth-child(7){width:65px;text-align:center}th:nth-child(8),td:nth-child(8){width:110px}
    select{width:100%;min-width:0;height:42px;padding:8px 10px;border:1px solid #ddd;border-radius:10px;background:#fff;font-size:14px;font-weight:800}
    select.estadoSelect.pendiente{background:#e7f0ff;border-color:#b6d0ff;color:#0b3d91}select.estadoSelect.presente{background:#dff5e5;border-color:#a7e1b7;color:#0f5132}select.estadoSelect.atendido{background:#e8def8;border-color:#c9b5ef;color:#4b267b}select.estadoSelect.ausente{background:#fde2e6;border-color:#f2b7c2;color:#842029}
    .patientLink{font-weight:900;cursor:pointer;text-decoration:underline;text-underline-offset:3px;display:inline-block;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .attendedBtn{width:100%;height:42px;background:#e8def8;border-color:#c9b5ef;color:#4b267b;font-weight:900}.attendedBtn.done{background:#dff5e5;border-color:#a7e1b7;color:#0f5132}
    .cards{display:none}.turnoCard{border:1px solid #eee;border-radius:14px;padding:12px;margin:10px 0}.turnoHora{font-size:18px;font-weight:900}.turnoLinea{margin-top:7px;font-size:14px}.mobileActions{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
    .modalBackdrop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(0,0,0,.35);z-index:9999}.modal{width:100%;max-width:760px;max-height:85vh;background:#fff;border:1px solid #eee;border-radius:16px;box-shadow:0 20px 70px rgba(0,0,0,.2);display:flex;flex-direction:column;overflow:hidden}
    .modalHead{display:flex;justify-content:space-between;gap:12px;padding:14px;border-bottom:1px solid #eee}.modalTitle{font-weight:900}.modalBody{padding:14px;overflow:auto}.modalGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{border:1px solid #eee;border-radius:14px;padding:12px}.histItem{padding:10px 0;border-bottom:1px solid #eee}.histItem:last-child{border-bottom:0}
    @media(max-width:900px){.kpi{grid-template-columns:repeat(2,1fr)}.tableWrap{display:none}.cards{display:block}}
    @media(max-width:650px){.dateNav{grid-template-columns:1fr 1fr}.dateBox{grid-column:1/-1;grid-row:1}.modalGrid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div><div class="brand" id="brandTitle">Agenda médica</div><div class="muted" id="brandSubtitle">Sala de espera y próximos días de atención</div><div class="muted" id="userLine"></div></div>
    <div class="right"><button id="btnRefresh" class="primary" type="button">Actualizar</button><button id="btnAusencias" class="small" type="button">Mis ausencias</button><button id="btnLogout" class="small" type="button">Salir</button></div>
  </div>

  <div class="card">
    <div class="dateNav"><button id="btnPrevDay" type="button">← Día anterior</button><div class="dateBox"><div class="dateTitle" id="dateTitle">—</div><div class="dateSub" id="dateSub">Cargando agenda…</div></div><button id="btnNextDay" type="button">Día siguiente →</button></div>
    <div class="kpi" id="kpis"></div><div class="error" id="err"></div><div class="ok" id="ok"></div>
  </div>

  <div class="card tableWrap"><table><thead><tr><th>Hora</th><th>Paciente</th><th>Obra social</th><th>Estado</th><th>Práctica</th><th>Copago</th><th>Transf.</th><th>Acción</th></tr></thead><tbody id="tbody"></tbody></table></div>
  <div class="card cards" id="cards"></div>
</div>

<div class="modalBackdrop" id="modalPaciente"><div class="modal" role="dialog" aria-modal="true"><div class="modalHead"><div><div class="modalTitle" id="mTitle">Paciente</div><div class="muted" id="mSub">—</div></div><button id="btnCloseModal" class="small" type="button">Cerrar ✕</button></div><div class="modalBody"><div class="modalGrid"><div class="box"><div class="muted">DNI</div><div id="mDni">—</div></div><div class="box"><div class="muted">Afiliado</div><div id="mAf">—</div></div><div class="box"><div class="muted">Obra social</div><div id="mOS">—</div></div><div class="box"><div class="muted">Teléfono</div><div id="mTel">—</div></div><div class="box"><div class="muted">Email</div><div id="mEmail">—</div></div></div><div style="height:12px"></div><div class="box"><div class="brand">Historial de atención</div><div class="muted">Últimos 2 años dentro de la clínica.</div><div id="mHist" style="margin-top:10px"></div></div></div></div></div>

<script src="./config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL=window.__SB__?.url;const SUPABASE_ANON_KEY=window.__SB__?.anonKey;if(!SUPABASE_URL||!SUPABASE_ANON_KEY){alert("Falta config.js");throw new Error("Missing Supabase config")}
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const AR_TZ = "America/Argentina/Buenos_Aires";
const IDLE_MIN = 20;

let idleTimer = null;
let ME = null;
let TENANT = null;

let DIAS_AGENDA = [];
let DIA_INDEX = 0;

let AGENDA_CACHE = new Map();
let AGENDA_ROWS = [];

let realtimeTurnosChannel = null;
let realtimeReloadTimer = null;
const brandTitle = document.getElementById("brandTitle");
const brandSubtitle = document.getElementById("brandSubtitle");
const userLine = document.getElementById("userLine");

const dateTitle = document.getElementById("dateTitle");
const dateSub = document.getElementById("dateSub");

const btnPrevDay = document.getElementById("btnPrevDay");
const btnNextDay = document.getElementById("btnNextDay");
const btnRefresh = document.getElementById("btnRefresh");
const btnAusencias = document.getElementById("btnAusencias");
const btnLogout = document.getElementById("btnLogout");

const elKpis = document.getElementById("kpis");
const elErr = document.getElementById("err");
const elOk = document.getElementById("ok");
const elBody = document.getElementById("tbody");
const elCards = document.getElementById("cards");

const modalPaciente = document.getElementById("modalPaciente");
const btnCloseModal = document.getElementById("btnCloseModal");

const mTitle = document.getElementById("mTitle");
const mSub = document.getElementById("mSub");
const mDni = document.getElementById("mDni");
const mAf = document.getElementById("mAf");
const mOS = document.getElementById("mOS");
const mTel = document.getElementById("mTel");
const mEmail = document.getElementById("mEmail");
const mHist = document.getElementById("mHist");

  function iniciarRealtimeTurnos() {
  if (!ME?.medico_id) return;

  if (realtimeTurnosChannel) {
    sb.removeChannel(realtimeTurnosChannel);
  }

  realtimeTurnosChannel = sb
    .channel(`agenda-medico-${ME.medico_id}`)
    .on(
      "postgres_changes",
      {
        event: "*",
        schema: "public",
        table: "Turnos",
        filter: `medico_id=eq.${ME.medico_id}`
      },
      (payload) => {
        console.log("Cambio Realtime recibido:", payload);

        clearTimeout(realtimeReloadTimer);

        realtimeReloadTimer = setTimeout(async () => {
          const fechaActual = DIAS_AGENDA[DIA_INDEX];

          if (!fechaActual) return;

          AGENDA_CACHE.delete(fechaActual);
          await cargarAgendaActual(true);
        }, 500);
      }
    )
    .subscribe((status, error) => {
      console.log("Realtime médico:", status, error);

      if (status === "SUBSCRIBED") {
        dateSub.textContent = "Agenda sincronizada en tiempo real";
      }

      if (
        status === "CHANNEL_ERROR" ||
        status === "TIMED_OUT" ||
        status === "CLOSED"
      ) {
        dateSub.textContent = `Realtime sin conexión: ${status}`;
      }
    });
}
  async function hardLogout(){try{await sb.auth.signOut()}catch(e){}location.href="./login.html"}function resetIdle(){if(idleTimer)clearTimeout(idleTimer);idleTimer=setTimeout(hardLogout,IDLE_MIN*60*1000)}["click","keydown","mousemove","touchstart","scroll"].forEach(ev=>addEventListener(ev,resetIdle,{passive:true}));resetIdle();
function isoDateARNow(){const parts=new Intl.DateTimeFormat("en-CA",{timeZone:AR_TZ,year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());const get=t=>parts.find(p=>p.type===t)?.value;return `${get("year")}-${get("month")}-${get("day")}`}
function addDaysISO(iso,n){const[y,m,d]=iso.split("-").map(Number),dt=new Date(Date.UTC(y,m-1,d));dt.setUTCDate(dt.getUTCDate()+n);return[dt.getUTCFullYear(),String(dt.getUTCMonth()+1).padStart(2,"0"),String(dt.getUTCDate()).padStart(2,"0")].join("-")}
function fmtHora(ts){return new Date(ts).toLocaleTimeString("es-AR",{timeZone:AR_TZ,hour:"2-digit",minute:"2-digit",hour12:false})}function fmtFecha(iso){return new Date(`${iso}T12:00:00-03:00`).toLocaleDateString("es-AR",{timeZone:AR_TZ,weekday:"long",day:"numeric",month:"long",year:"numeric"})}function money(value){return new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0}).format(Number(value)||0)}function toast(msg){elOk.textContent=msg;setTimeout(()=>{if(elOk.textContent===msg)elOk.textContent=""},1600)}
function applyEstadoColor(sel){sel.classList.remove("pendiente","presente","atendido","ausente");if(["pendiente","presente","atendido","ausente"].includes(sel.value))sel.classList.add(sel.value)}

  async function cargarIdentidad(){const{data:{user}}=await sb.auth.getUser();if(!user){location.href="./login.html";return false}const{data,error}=await sb.rpc("cfg_get_me");if(error)throw error;if(!data?.length)throw new Error("Usuario sin perfil activo.");ME=data[0];if(String(ME.rol||"").toLowerCase()!=="medico")throw new Error("Acceso exclusivo para médicos.");if(!ME.tenant_id||!ME.medico_id)throw new Error("El usuario médico no está vinculado correctamente.");userLine.textContent=`Usuario: ${ME.nombre||user.email}`;const tenantRes=await sb.from("Tenants").select("id,nombre,theme,color_primario,color_secundario").eq("id",ME.tenant_id).eq("activo",true).maybeSingle();if(tenantRes.error)throw tenantRes.error;TENANT=tenantRes.data||null;const title=TENANT?.theme?.header?.title||TENANT?.nombre||"ReserMed";brandTitle.textContent=`${title} · ${ME.nombre||"Médico"}`;brandSubtitle.textContent="Sala de espera y agenda profesional";document.title=`${title} · Agenda médica`;document.documentElement.style.setProperty("--primary",TENANT?.color_primario||"#111");document.documentElement.style.setProperty("--bg",TENANT?.color_secundario||"#f6f7f8");return true}

  async function cargarDiasAgenda(){const hoy=isoDateARNow(),desde=addDaysISO(hoy,-90),hasta=addDaysISO(hoy,180);const{data,error}=await sb.rpc("medico_get_dias_agenda",{p_desde:desde,p_hasta:hasta});if(error)throw error;DIAS_AGENDA=(data||[]).map(x=>String(x.dia||x)).filter(Boolean).sort();if(!DIAS_AGENDA.length){DIA_INDEX=0;return}const hoyIndex=DIAS_AGENDA.indexOf(hoy);if(hoyIndex>=0){DIA_INDEX=hoyIndex;return}const prox=DIAS_AGENDA.findIndex(d=>d>hoy);DIA_INDEX=prox>=0?prox:DIAS_AGENDA.length-1}

  async function pedirAgendaDia(fecha,forzar=false){if(!forzar&&AGENDA_CACHE.has(fecha))return AGENDA_CACHE.get(fecha);const{data,error}=await sb.rpc("medico_get_agenda_dia",{p_fecha:fecha});if(error)throw error;const rows=data||[];AGENDA_CACHE.set(fecha,rows);return rows}

  async function cargarAgendaActual(forzar=false){elErr.textContent="";elOk.textContent="";elBody.innerHTML="";elCards.innerHTML="";elKpis.innerHTML="";if(!DIAS_AGENDA.length){dateTitle.textContent="Sin agenda";dateSub.textContent="No hay días de atención dentro del período consultado.";btnPrevDay.disabled=true;btnNextDay.disabled=true;return}const fecha=DIAS_AGENDA[DIA_INDEX];dateTitle.textContent=fmtFecha(fecha);dateSub.textContent="Agenda del día seleccionado";btnPrevDay.disabled=DIA_INDEX<=0;btnNextDay.disabled=DIA_INDEX>=DIAS_AGENDA.length-1;try{AGENDA_ROWS=await pedirAgendaDia(fecha,forzar);renderKpis(AGENDA_ROWS);renderAgenda(AGENDA_ROWS)}catch(e){elErr.textContent=e?.message||"Error cargando agenda."}}
function renderKpis(rows){const total=rows.length,pendientes=rows.filter(r=>r.estado==="pendiente").length,presentes=rows.filter(r=>r.estado==="presente").length,atendidos=rows.filter(r=>r.estado==="atendido").length,totalCopago=rows.reduce((a,r)=>a+(Number(r.copago)||0),0),efectivo=rows.filter(r=>r.copago_transferencia!==true).reduce((a,r)=>a+(Number(r.copago)||0),0),transferencia=rows.filter(r=>r.copago_transferencia===true).reduce((a,r)=>a+(Number(r.copago)||0),0);elKpis.innerHTML=`<div class="pill">Turnos<b>${total}</b></div><div class="pill">En espera<b>${presentes}</b></div><div class="pill">Pendientes<b>${pendientes}</b></div><div class="pill">Atendidos<b>${atendidos}</b></div><div class="pill">Efectivo<b>${money(efectivo)}</b></div><div class="pill">Transferencia<b>${money(transferencia)}</b></div><div class="pill" style="grid-column:1/-1">Copago total del día<b>${money(totalCopago)}</b></div>`}
function estadoOptions(estado){return[["pendiente","Pendiente"],["presente","Presente"],["atendido","Atendido"],["ausente","Ausente"]].map(([v,l])=>`<option value="${v}" ${estado===v?"selected":""}>${l}</option>`).join("")}
function renderAgenda(rows){if(!rows.length){elBody.innerHTML=`<tr><td colspan="8" class="muted">Sin turnos para este día.</td></tr>`;elCards.innerHTML=`<div class="muted">Sin turnos para este día.</div>`;return}rows.forEach(r=>{const tr=document.createElement("tr");tr.dataset.turno=r.turno_id;tr.innerHTML=`<td><b>${fmtHora(r.inicio)}</b></td><td><span class="patientLink" data-paciente="${r.turno_id}">${r.paciente_nombre||"—"}</span></td><td>${r.obra_social||"—"}</td>

<td>
  <span class="estadoBadge ${r.estado}">
    ${r.estado}
  </span>
</td>
<td>${r.practica_nombre||r.practica_id||"Consulta"}</td><td><b>${money(r.copago)}</b></td><td>${r.copago_transferencia?"✓":"—"}</td><td><button class="attendedBtn ${r.estado==="atendido"?"done":""}" data-atendido="${r.turno_id}" type="button">${r.estado==="atendido"?"Atendido ✓":"Marcar atendido"}</button></td>`;elBody.appendChild(tr);tr.querySelector(`[data-paciente="${r.turno_id}"]`).onclick=()=>abrirFichaPaciente(r)});rows.forEach(r=>{const card=document.createElement("div");card.className="turnoCard";card.dataset.turno=r.turno_id;card.innerHTML=`<div class="turnoHora">${fmtHora(r.inicio)}</div><div class="turnoLinea"><b>Paciente:</b> <span class="patientLink" data-paciente="${r.turno_id}">${r.paciente_nombre||"—"}</span></div><div class="turnoLinea"><b>Obra social:</b> ${r.obra_social||"—"}</div><div class="turnoLinea"><b>Práctica:</b> ${r.practica_nombre||r.practica_id||"Consulta"}</div><div class="turnoLinea"><b>Copago:</b> ${money(r.copago)} ${r.copago_transferencia?"· Transferencia":"· Efectivo"}</div><div class="mobileActions"><select class="estadoSelect" data-estado="${r.turno_id}">${estadoOptions(r.estado)}</select><button class="attendedBtn ${r.estado==="atendido"?"done":""}" data-atendido="${r.turno_id}" type="button">${r.estado==="atendido"?"Atendido ✓":"Marcar atendido"}</button></div>`;elCards.appendChild(card);card.querySelector(`[data-paciente="${r.turno_id}"]`).onclick=()=>abrirFichaPaciente(r)});document.querySelectorAll("select.estadoSelect").forEach(applyEstadoColor);document.querySelectorAll("[data-estado]").forEach(sel=>{sel.onchange=async()=>{await actualizarEstado(sel.getAttribute("data-estado"),sel.value,sel)}});document.querySelectorAll("[data-atendido]").forEach(btn=>{btn.onclick=async()=>{await actualizarEstado(btn.getAttribute("data-atendido"),"atendido",btn)}})}

  async function actualizarEstado(turnoId, estado, elemento) {
  elemento
    ?.closest("[data-turno]")
    ?.classList.add("saving");

  elErr.textContent = "";

  const { error } = await sb.rpc(
    "medico_set_turno_estado",
    {
      p_turno_id: turnoId,
      p_estado: estado
    }
  );

  elemento
    ?.closest("[data-turno]")
    ?.classList.remove("saving");

  if (error) {
    elErr.textContent = error.message;
    await cargarAgendaActual(true);
    return;
  }

  const fecha = DIAS_AGENDA[DIA_INDEX];

  if (fecha) {
    AGENDA_CACHE.delete(fecha);
  }

  toast(
    estado === "atendido"
      ? "✅ Paciente marcado como atendido."
      : "✅ Estado actualizado."
  );

  // Realtime actualizará la agenda.
}
function openModal(){modalPaciente.style.display="flex"}function closeModal(){modalPaciente.style.display="none"}btnCloseModal.onclick=closeModal;modalPaciente.addEventListener("click",e=>{if(e.target===modalPaciente)closeModal()});
async function abrirFichaPaciente(r){mTitle.textContent=r.paciente_nombre||"Paciente";mSub.textContent=`Turno: ${fmtHora(r.inicio)}`;mDni.textContent=r.dni||"—";mAf.textContent=r.numero_afiliado||"—";mOS.textContent=r.obra_social||"—";mTel.textContent=r.telefono||"—";mEmail.textContent=r.email||"—";mHist.innerHTML=`<div class="muted">Cargando historial…</div>`;openModal();if(!r.paciente_id){mHist.innerHTML=`<div class="muted">Paciente sin identificador.</div>`;return}const{data,error}=await sb.rpc("medico_get_historial_paciente",{p_paciente_id:r.paciente_id,p_anios:2});if(error){mHist.innerHTML=`<div class="muted">${error.message}</div>`;return}const rows=data||[];if(!rows.length){mHist.innerHTML=`<div class="muted">Sin historial reciente.</div>`;return}mHist.innerHTML=rows.map(h=>{const fecha=new Date(h.inicio).toLocaleDateString("es-AR",{timeZone:AR_TZ}),hora=fmtHora(h.inicio);return`<div class="histItem"><div><b>${fecha} · ${hora}</b></div><div class="muted">Estado: <b>${h.estado||"—"}</b></div><div class="muted">${h.practica_nombre?`Práctica: <b>${h.practica_nombre}</b>`:""}${h.medico_nombre?` · Médico: <b>${h.medico_nombre}</b>`:""}</div></div>`}).join("")}
btnPrevDay.onclick=async()=>{if(DIA_INDEX<=0)return;DIA_INDEX--;await cargarAgendaActual()};btnNextDay.onclick=async()=>{if(DIA_INDEX>=DIAS_AGENDA.length-1)return;DIA_INDEX++;await cargarAgendaActual()};btnRefresh.onclick=async()=>{const fecha=DIAS_AGENDA[DIA_INDEX];if(fecha)AGENDA_CACHE.delete(fecha);await cargarAgendaActual(true)};btnAusencias.onclick=()=>{location.href="./medico_ausencias.html"};btnLogout.onclick=hardLogout;
document.addEventListener("DOMContentLoaded", async () => {
  try {
    const ok = await cargarIdentidad();

    if (!ok) return;

    await cargarDiasAgenda();
    await cargarAgendaActual();

    iniciarRealtimeTurnos();

  } catch (e) {
    elErr.textContent =
      e?.message || "Error iniciando agenda médica.";
  }
});
</script>
</body>
</html>
