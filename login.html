<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login Secretaría · ENDO</title>

  <style>
    body{
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      background:#f6f7f8;
      margin:0;
    }
    .card{
      max-width:360px;
      margin:90px auto;
      background:#fff;
      border:1px solid #e7e7e7;
      border-radius:14px;
      padding:20px;
    }
    h2{margin:0 0 14px 0}
    input{
      width:100%;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid #ddd;
      margin:8px 0;
      font-size:14px;
    }
    button{
      width:100%;
      padding:12px;
      border-radius:12px;
      border:0;
      background:#111;
      color:#fff;
      font-weight:800;
      cursor:pointer;
      margin-top:10px;
    }
    button:disabled{opacity:.5}
    .err{color:#b00020;font-size:13px;margin-top:10px}
    .ok{color:#0a7a27;font-size:13px;margin-top:10px}
  </style>
</head>

<body>

  <div class="card">
    <h2>Secretaría</h2>

    <input id="email" placeholder="Email" />
    <input id="pass" type="password" placeholder="Contraseña" />

    <button id="btn">Entrar</button>

    <div id="err" class="err"></div>
    <div id="ok" class="ok"></div>
  </div>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://qqfjvxspiyecuthislnq.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFxZmp2eHNwaXllY3V0aGlzbG5xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk2MjE2OTQsImV4cCI6MjA4NTE5NzY5NH0.xHIldO1nBfhHJYLuskqJbkX95EbxRAjc4Y3SqHhlx3A";

    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const btn = document.getElementById("btn");
    const err = document.getElementById("err");
    const ok  = document.getElementById("ok");

    btn.onclick = async () => {
      err.textContent = "";
      ok.textContent  = "";
      btn.disabled = true;

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("pass").value;

      const { error } = await sb.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        err.textContent = "Usuario o contraseña incorrectos";
        btn.disabled = false;
        return;
      }

      ok.textContent = "✅ Acceso correcto";
      window.location.href = "./secre_admin.html";    };
  </script>

</body>
</html>
