<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login Secretaría</title>

</head>

<body>

  <!-- tu HTML (inputs + botón) acá -->
  <!-- Ej:
  <input id="email">
  <input id="pass">
  <button id="btn">Entrar</button>
  <div id="err"></div>
  <div id="ok"></div>
  -->

  <!-- ✅ 1) Primero cargás la librería -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- ✅ 2) Después tu script que usa supabase -->
  <script>
    const SUPABASE_URL = "https://qqfjvxspiyecuthislnq.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFxZmp2eHNwaXllY3V0aGlzbG5xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk2MjE2OTQsImV4cCI6MjA4NTE5NzY5NH0.xHIldO1nBfhHJYLuskqJbkX95EbxRAjc4Y3SqHhlx3A";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const err = document.getElementById("err");
    const ok  = document.getElementById("ok");
    const btn = document.getElementById("btn");

    btn.onclick = async () => {
      err.textContent = ""; ok.textContent = "";
      btn.disabled = true;

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("pass").value;

      const { error } = await sb.auth.signInWithPassword({ email, password });

      if (error) {
        err.textContent = "Login inválido.";
        btn.disabled = false;
        return;
      }

      ok.textContent = "✅ OK, entrando…";
      window.location.href = "/secre_admin.html";
    };
  </script>

</body>
</html>
