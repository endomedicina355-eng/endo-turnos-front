<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Consultar turnos</title>

  <style>
    :root{
      --primary:#111;
      --bg:#f6f7f8;
      --card:#fff;
      --border:#e7e7e7;
      --muted:#666;
      --danger:#b00020;
      --ok:#0a7a27;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      background:var(--bg);
      color:#111;
    }

    .wrap{
      max-width:760px;
      margin:0 auto;
      padding:18px;
    }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      padding:18px;
      margin:12px 0;
    }

    .brand{
      font-size:26px;
      font-weight:950;
      line-height:1.05;
    }

    .muted{
      color:var(--muted);
      font-size:13px;
    }

    .headerCard{
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:flex-start;
    }

    .pill{
      border:1px solid #ddd;
      border-radius:999px;
      padding:6px 10px;
      background:#fff;
      font-size:12px;
      font-weight:800;
      white-space:nowrap;
    }

    .formGrid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    @media(max-width:620px){
      .formGrid{grid-template-columns:1fr}
    }

    label{
      display:block;
      font-size:12px;
      color:var(--muted);
      font-weight:800;
      margin-bottom:5px;
    }

    input{
      width:100%;
      border:1px solid #ddd;
      border-radius:14px;
      padding:13px 14px;
      font-size:15px;
      font-weight:800;
      background:#fff;
    }

    button{
      width:100%;
      border:0;
      border-radius:14px;
      padding:14px;
      font-size:15px;
      font-weight:950;
      cursor:pointer;
    }

    button.primary{
      background:var(--primary);
      color:#fff;
    }

    button.secondary{
      background:#fff;
      color:#111;
      border:1px solid #ddd;
    }

    button:disabled{
      opacity:.5;
      cursor:not-allowed;
    }

    .error{
      color:var(--danger);
      font-size:13px;
      font-weight:800;
      margin-top:10px;
    }

    .ok{
      color:var(--ok);
      font-size:13px;
      font-weight:800;
      margin-top:10px;
    }

    .turnoCard{
      border:1px solid #eee;
      border-radius:18px;
      padding:16px;
      margin:12px 0;
      background:#fff;
    }

    .fecha{
      font-size:22px;
      font-weight:950;
      margin-bottom:4px;
    }

    .hora{
      font-size:18px;
      font-weight:900;
      color:#333;
    }

    .medico{
      margin-top:12px;
      font-weight:950;
      font-size:17px;
    }

    .esp{
      color:#555;
      font-weight:700;
      margin-top:2px;
    }

    .info{
      margin-top:10px;
      color:#444;
      font-size:14px;
      line-height:1.45;
    }

    .warn{
      background:#fff8e1;
      border:1px solid #ffe08a;
      color:#5f4300;
      border-radius:14px;
      padding:12px;
      font-size:13px;
      font-weight:800;
      line-height:1.45;
      margin-top:12px;
    }

    .hidden{display:none}

    a{
      color:#111;
      text-decoration:none;
      font-weight:900;
    }

    .footerLine{
      margin-top:6px;
      color:#444;
      font-size:14px;
      line-height:1.45;
    }
  </style>
</head>

<body>
<div class="wrap">

  <div class="card headerCard">
    <div>
      <div class="brand" id="tenantNombre">Turnos online</div>
      <div class="muted" id="tenantDireccion">—</div>
    </div>
    <div class="pill">Consulta paciente</div>
  </div>

  <div class="card">
    <div class="brand" style="font-size:22px">Consultar mis turnos</div>
    <div class="muted" style="margin-top:4px">
      Ingresá DNI y apellido para ver tus próximos turnos.
    </div>

    <div style="height:14px"></div>

    <div class="formGrid">
      <div>
        <label>DNI</label>
        <input id="dni" inputmode="numeric" placeholder="Ej: 33123456" />
      </div>

      <div>
        <label>Apellido</label>
        <input id="apellido" placeholder="Ej: Pérez" />
      </div>
    </div>

    <button id="btnBuscar" class="primary" type="button" style="margin-top:12px">
      Buscar turnos
    </button>

    <div class="error" id="err"></div>
    <div class="ok" id="ok"></div>
  </div>

  <div id="resultado" class="card hidden">
    <div class="brand" style="font-size:22px">Tus próximos turnos</div>
    <div class="muted">Seleccioná el turno que querés gestionar.</div>
    <div id="listaTurnos"></div>
  </div>

  <div class="card">
    <b id="footerTenant">Clínica</b>
    <div class="footerLine" id="footerDireccion">—</div>
    <div class="footerLine" id="footerTel">—</div>
  </div>

</div>

<script src="./config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = window.__SB__?.url;
const SUPABASE_ANON_KEY = window.__SB__?.anonKey;

if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
  alert("Falta config.js");
  throw new Error("Missing Supabase config");
}

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const AR_TZ = "America/Argentina/Buenos_Aires";

const params = new URLSearchParams(window.location.search);
const TENANT_SLUG = (params.get("t") || "endo").trim();

const tenantNombre = document.getElementById("tenantNombre");
const tenantDireccion = document.getElementById("tenantDireccion");
const footerTenant = document.getElementById("footerTenant");
const footerDireccion = document.getElementById("footerDireccion");
const footerTel = document.getElementById("footerTel");

const dniInput = document.getElementById("dni");
const apellidoInput = document.getElementById("apellido");
const btnBuscar = document.getElementById("btnBuscar");

const err = document.getElementById("err");
const ok = document.getElementById("ok");
const resultado = document.getElementById("resultado");
const listaTurnos = document.getElementById("listaTurnos");

let TENANT = null;

function setErr(msg){
  err.textContent = msg || "";
  ok.textContent = "";
}

function setOk(msg){
  ok.textContent = msg || "";
  err.textContent = "";
}

function cleanDni(v){
  return (v || "").replace(/[^\d]/g, "");
}

function mapsLink(direccion){
  if (!direccion) return "#";
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(direccion)}`;
}

function fmtHora(ts){
  return new Date(ts).toLocaleTimeString("es-AR", {
    timeZone: AR_TZ,
    hour:"2-digit",
    minute:"2-digit",
    hour12:false
  });
}

function fmtFecha(ts){
  return new Date(ts).toLocaleDateString("es-AR", {
    timeZone: AR_TZ,
    weekday:"long",
    day:"2-digit",
    month:"long",
    year:"numeric"
  });
}

function aplicarTenantVisual(){
  const primary = TENANT?.color_primario || "#111111";
  const bg = TENANT?.color_secundario || "#f6f7f8";

  document.documentElement.style.setProperty("--primary", primary);
  document.documentElement.style.setProperty("--bg", bg);
}

async function cargarTenant(){
  const { data, error } = await sb
    .from("Tenants")
    .select("id,nombre,direccion,telefono,whatsapp,color_primario,color_secundario")
    .eq("slug", TENANT_SLUG)
    .eq("activo", true)
    .maybeSingle();

  if (error || !data?.id){
    setErr("No se encontró la clínica.");
    return;
  }

  TENANT = data;
  aplicarTenantVisual();

  const nombre = TENANT.nombre || "Clínica";
  const direccion = TENANT.direccion || "";
  const telefono = TENANT.telefono || "";
  const whatsapp = TENANT.whatsapp || "";

  tenantNombre.textContent = nombre;
  tenantDireccion.innerHTML = direccion
    ? `<a href="${mapsLink(direccion)}" target="_blank">${direccion}</a>`
    : "Dirección no disponible";

  footerTenant.textContent = nombre;
  footerDireccion.innerHTML = direccion
    ? `📍 <a href="${mapsLink(direccion)}" target="_blank">${direccion}</a>`
    : "📍 —";

  footerTel.textContent = telefono ? `☎️ ${telefono}` : (whatsapp ? `💬 ${whatsapp}` : "☎️ —");

  document.title = `${nombre} · Consultar turnos`;
}

function renderTurnos(rows){
  listaTurnos.innerHTML = "";

  if (!rows.length){
    resultado.classList.remove("hidden");
    listaTurnos.innerHTML = `
      <div class="warn">
        No encontramos turnos futuros pendientes con esos datos.
      </div>
    `;
    return;
  }

  resultado.classList.remove("hidden");

  rows.forEach(t => {
    const card = document.createElement("div");
    card.className = "turnoCard";

    const tieneToken = !!t.manage_token;

    card.innerHTML = `
      <div class="fecha">${fmtFecha(t.inicio)}</div>
      <div class="hora">${fmtHora(t.inicio)} hs</div>

      <div class="medico">${t.medico_nombre || "-"}</div>
      <div class="esp">${t.medico_especialidad || "-"}</div>

      <div class="info">
        <b>Paciente:</b> ${t.paciente_nombre || "-"}<br/>
        <b>Obra social:</b> ${t.obra_social || "-"}<br/>
        <b>Estado:</b> ${t.estado || "-"}
      </div>

      ${
        tieneToken
        ? `<button class="primary" type="button" style="margin-top:14px" data-token="${t.manage_token}">
             Gestionar turno
           </button>`
        : `<div class="warn">
             Este turno no tiene gestión online disponible. Comunicate con Secretaría.
           </div>`
      }
    `;

    listaTurnos.appendChild(card);
  });

  document.querySelectorAll("[data-token]").forEach(btn => {
    btn.onclick = () => {
      const token = btn.getAttribute("data-token");
      window.location.href = `./gestionportoken?token=${token}`;
    };
  });
}

async function buscarTurnos(){
  setErr("");
  setOk("");
  resultado.classList.add("hidden");
  listaTurnos.innerHTML = "";

  if (!TENANT?.id){
    setErr("No se pudo identificar la clínica.");
    return;
  }

  const dni = cleanDni(dniInput.value);
  const apellido = (apellidoInput.value || "").trim();

  if (!dni){
    setErr("Ingresá DNI.");
    return;
  }

  if (!apellido){
    setErr("Ingresá apellido.");
    return;
  }

  btnBuscar.disabled = true;
  btnBuscar.textContent = "Buscando…";

  const { data, error } = await sb.rpc("public_consultar_turnos_paciente", {
    p_tenant_id: TENANT.id,
    p_dni: dni,
    p_apellido: apellido
  });

  btnBuscar.disabled = false;
  btnBuscar.textContent = "Buscar turnos";

  if (error){
    setErr(error.message);
    return;
  }

  renderTurnos(data || []);
}

btnBuscar.onclick = buscarTurnos;

[dniInput, apellidoInput].forEach(el => {
  el.addEventListener("keydown", e => {
    if (e.key === "Enter") buscarTurnos();
  });
});

cargarTenant();
</script>
</body>
</html>
