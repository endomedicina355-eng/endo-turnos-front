<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ENDO · Admin Secretaría</title>

  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;margin:0;background:#f6f7f8;color:#111}
    .wrap{max-width:1100px;margin:0 auto;padding:18px}
    .card{background:#fff;border:1px solid #e7e7e7;border-radius:14px;padding:16px;margin:12px 0}
    .header{display:flex;justify-content:space-between;gap:12px;align-items:center}
    .brand{font-weight:900}
    .muted{color:#666;font-size:13px}

    /* ✅ ahora son 3 columnas (sin buscar) */
    .row{display:grid;gap:10px;grid-template-columns:1fr 1fr 1fr}
    @media(max-width:900px){.row{grid-template-columns:1fr}}

    input,select{width:100%;padding:10px 12px;border-radius:12px;border:1px solid #ddd;font-size:14px;background:#fff;box-sizing:border-box}
    button{border:1px solid #ddd;background:#fff;border-radius:12px;padding:10px 12px;cursor:pointer}
    button.primary{background:#111;color:#fff;border:0;font-weight:800}
    button.small{padding:8px 10px;border-radius:10px;font-size:13px}
    .right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

    .kpi{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    .kpi .pill{border:1px solid #ddd;border-radius:999px;padding:6px 10px;font-size:12px;background:#fff}
    .error{color:#b00020;font-size:13px}
    .ok{color:#0a7a27;font-size:13px}
    .saving{opacity:.55}

    /* Tabla desktop */
    .tableWrap{overflow:auto}
    table{width:100%;border-collapse:collapse;min-width:980px}
    th,td{padding:10px;border-bottom:1px solid #eee;font-size:14px;vertical-align:middle}
    th{color:#666;font-weight:700;text-align:left;font-size:12px}

    /* Select Estado con colores */
    select.estadoSelect{font-weight:800}
    select.estadoSelect.pendiente{background:#e7f0ff;border-color:#b6d0ff;color:#0b3d91}
    select.estadoSelect.presente{background:#dff5e5;border-color:#a7e1b7;color:#0f5132}
    select.estadoSelect.ausente{background:#fde2e6;border-color:#f2b7c2;color:#842029}

    /* Mobile cards */
    .cards{display:none}
    .turnoCard{border:1px solid #eee;border-radius:14px;padding:12px;margin:10px 0}
    .turnoTop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
    .turnoHora{font-weight:900;font-size:18px}
    .turnoLinea{margin-top:6px;font-size:14px}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
    .actions .full{grid-column:1/-1}

    @media(max-width:900px){
      .tableWrap{display:none}
      .cards{display:block}
    }

    /* ✅ Accordion por médico */
    .accWrap{margin-top:6px}
    details.acc{border:1px solid #eee;border-radius:14px;margin:10px 0;overflow:hidden;background:#fff}
    details.acc summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-weight:900}
    details.acc summary::-webkit-details-marker{display:none}
    .pillMini{border:1px solid #ddd;border-radius:999px;padding:4px 8px;font-size:12px;background:#fff}
    .accBody{padding:0 10px 10px 10px}
    .innerTable{width:100%;border-collapse:collapse}
    .innerTable td{border-bottom:1px solid #eee}
  </style>
</head>

<body>
<div class="wrap">
  <div class="header">
    <div>
      <div class="brand">ENDO · Admin Secretaría</div>
      <div class="muted">Agenda diaria</div>
    </div>
    <div class="right">
      <button id="btnRefresh" class="primary" type="button">Actualizar</button>
      <button id="btnIrTurnos" class="small" type="button">Turnos / Sobreturnos</button>
      <button id="btnLogout" class="small" type="button">Salir</button>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <div>
        <div class="muted">Fecha</div>
        <input id="fecha" type="date" />
      </div>
      <div>
        <div class="muted">Médico</div>
        <select id="medico">
          <option value="">Todos</option>
        </select>
      </div>
      <div>
        <div class="muted">Estado</div>
        <select id="estado">
          <option value="pendiente" selected>Pendiente</option>
          <option value="presente">Presente</option>
          <option value="ausente">Ausente</option>
          <option value="todos">Todos</option>
        </select>
      </div>
    </div>

    <div class="kpi" id="kpis"></div>
    <div class="error" id="err"></div>
    <div class="ok" id="ok"></div>
  </div>

  <!-- Desktop -->
  <div class="card tableWrap">
    <table>
      <thead>
        <tr>
          <th>Hora</th>
          <th>Médico</th>
          <th>Paciente</th>
          <th>DNI</th>
          <th>Obra social</th>
          <th>Copago</th>
          <th>Estado</th>
          <th>Nota</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <!-- Mobile -->
  <div class="card cards" id="cards"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===== CONFIG ===== */
const SUPABASE_URL = "https://qqfjvxspiyecuthislnq.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFxZmp2eHNwaXllY3V0aGlzbG5xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk2MjE2OTQsImV4cCI6MjA4NTE5NzY5NH0.xHIldO1nBfhHJYLuskqJbkX95EbxRAjc4Y3SqHhlx3A";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const AR_TZ = "America/Argentina/Buenos_Aires";

/* ===== DOM ===== */
const elFecha  = document.getElementById("fecha");
const elMedico = document.getElementById("medico");
const elEstado = document.getElementById("estado");
const elErr    = document.getElementById("err");
const elOk     = document.getElementById("ok");
const elBody   = document.getElementById("tbody");
const elCards  = document.getElementById("cards");
const elKpis   = document.getElementById("kpis");

const btnRefresh = document.getElementById("btnRefresh");
const btnIrTurnos = document.getElementById("btnIrTurnos");
const btnLogout = document.getElementById("btnLogout");

/* ===== Helpers ===== */
function isoDateARNow(){
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: AR_TZ, year:"numeric", month:"2-digit", day:"2-digit"
  }).formatToParts(new Date());
  const y = parts.find(p=>p.type==="year").value;
  const m = parts.find(p=>p.type==="month").value;
  const d = parts.find(p=>p.type==="day").value;
  return `${y}-${m}-${d}`;
}
function fmtHora(ts){
  return new Date(ts).toLocaleTimeString("es-AR", { timeZone: AR_TZ, hour:"2-digit", minute:"2-digit" });
}
function toastOk(msg){
  elOk.textContent = msg;
  setTimeout(()=> elOk.textContent="", 1200);
}
function applyEstadoColor(sel){
  sel.classList.remove("pendiente","presente","ausente");
  if (["pendiente","presente","ausente"].includes(sel.value)) sel.classList.add(sel.value);
}

/* ===== NUEVO: agrupado por médico (accordion) ===== */
function groupByMedico(rows){
  const map = new Map();
  (rows||[]).forEach(r=>{
    const key = r.medico_id || r.medico_nombre || "sin_medico";
    if (!map.has(key)) map.set(key, { medico_id: r.medico_id, medico_nombre: r.medico_nombre || "—", items: [] });
    map.get(key).items.push(r);
  });
  return Array.from(map.values()).sort((a,b)=> (a.medico_nombre||"").localeCompare(b.medico_nombre||""));
}
function safeId(str){
  return String(str||"x").replaceAll(/[^a-zA-Z0-9_]/g,"_");
}
function renderAgendaAccordion(rows){
  elBody.innerHTML = "";
  elCards.innerHTML = "";

  const grupos = groupByMedico(rows);

  // Desktop: metemos acordeones dentro del tbody (sin tocar inputs)
  grupos.forEach(g=>{
    const gid = safeId(g.medico_id || g.medico_nombre);
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td colspan="8" style="padding:0;border-bottom:0">
        <details class="acc" open>
          <summary>
            <span>${g.medico_nombre}</span>
            <span class="pillMini">Turnos: <b>${g.items.length}</b></span>
          </summary>
          <div class="accBody">
            <table class="innerTable">
              <tbody id="inner_${gid}"></tbody>
            </table>
          </div>
        </details>
      </td>
    `;
    elBody.appendChild(tr);

    const inner = tr.querySelector(`#inner_${gid}`);

    g.items.forEach(r=>{
      const row = document.createElement("tr");
      row.dataset.turno = r.turno_id;
      row.innerHTML = `
        <td style="width:80px"><b>${fmtHora(r.inicio)}</b></td>
        <td>${r.medico_nombre || "-"}</td>
        <td>${r.paciente_nombre || "-"}</td>
        <td>${r.dni || "-"}</td>
        <td>${r.obra_social || "-"} ${r.numero_afiliado ? "· " + r.numero_afiliado : ""}</td>
        <td><input data-copago="${r.turno_id}" value="${r.copago ?? ""}" placeholder="0" inputmode="numeric"/></td>
        <td>
          <select class="estadoSelect" data-estado="${r.turno_id}">
            <option value="pendiente" ${r.estado==="pendiente"?"selected":""}>Pendiente</option>
            <option value="presente"  ${r.estado==="presente" ?"selected":""}>Presente</option>
            <option value="ausente"   ${r.estado==="ausente"  ?"selected":""}>Ausente</option>
          </select>
        </td>
        <td><input data-nota="${r.turno_id}" value="${r.nota ?? ""}" placeholder="Nota..." /></td>
      `;
      inner.appendChild(row);
    });
  });

  // Mobile: acordeón por médico + cards
  grupos.forEach(g=>{
    const det = document.createElement("details");
    det.className = "acc";
    det.open = true;
    det.innerHTML = `
      <summary>
        <span>${g.medico_nombre}</span>
        <span class="pillMini">Turnos: <b>${g.items.length}</b></span>
      </summary>
      <div class="accBody" id="cards_${safeId(g.medico_id || g.medico_nombre)}"></div>
    `;
    elCards.appendChild(det);

    const inner = det.querySelector(".accBody");
    g.items.forEach(r=>{
      const div = document.createElement("div");
      div.className = "turnoCard";
      div.dataset.turno = r.turno_id;
      div.innerHTML = `
        <div class="turnoTop">
          <div>
            <div class="turnoHora">${fmtHora(r.inicio)}</div>
            <div class="muted">${r.medico_nombre || "-"}</div>
          </div>
        </div>

        <div class="turnoLinea"><b>Paciente:</b> ${r.paciente_nombre || "-"}</div>
        <div class="turnoLinea"><b>DNI:</b> ${r.dni || "-"}</div>
        <div class="turnoLinea"><b>OS:</b> ${r.obra_social || "-"} ${r.numero_afiliado ? "· " + r.numero_afiliado : ""}</div>

        <div class="actions">
          <select class="full estadoSelect" data-estado="${r.turno_id}">
            <option value="pendiente" ${r.estado==="pendiente"?"selected":""}>Pendiente</option>
            <option value="presente"  ${r.estado==="presente" ?"selected":""}>Presente</option>
            <option value="ausente"   ${r.estado==="ausente"  ?"selected":""}>Ausente</option>
          </select>

          <input class="full" data-copago="${r.turno_id}" value="${r.copago ?? ""}" placeholder="Copago" inputmode="numeric" />
          <input class="full" data-nota="${r.turno_id}" value="${r.nota ?? ""}" placeholder="Nota..." />
        </div>
      `;
      inner.appendChild(div);
    });
  });

  // ✅ NO tocamos nada: mismo wiring que ya tenías (solo vuelve a correr)
  document.querySelectorAll("select.estadoSelect").forEach(applyEstadoColor);

  document.querySelectorAll("[data-estado]").forEach(sel=>{
    sel.onchange = async () => {
      applyEstadoColor(sel);
      const id = sel.getAttribute("data-estado");
      const row = document.querySelector(`[data-turno="${id}"]`);
      row && row.classList.add("saving");
      const ok = await patchTurno(id, { estado: sel.value });
      row && row.classList.remove("saving");
      if (ok) toastOk("✅ Estado actualizado");
    };
  });

  document.querySelectorAll("[data-copago]").forEach(inp=>{
    const saveNow = async ()=>{
      const id = inp.getAttribute("data-copago");
      const v = (inp.value ?? "").trim();
      const num = v === "" ? null : Number(v);
      if (v !== "" && Number.isNaN(num)) return;

      const row = document.querySelector(`[data-turno="${id}"]`);
      row && row.classList.add("saving");
      const ok = await patchTurno(id, { copago: num });
      row && row.classList.remove("saving");
      if (ok) toastOk("✅ Copago actualizado");
    };
    inp.onblur = saveNow;
    inp.onkeydown = (e)=>{ if (e.key==="Enter"){ e.preventDefault(); inp.blur(); } };
  });

  document.querySelectorAll("[data-nota]").forEach(inp=>{
    const saveNow = async ()=>{
      const id = inp.getAttribute("data-nota");
      const v = (inp.value ?? "").trim();
      const row = document.querySelector(`[data-turno="${id}"]`);
      row && row.classList.add("saving");
      const ok = await patchTurno(id, { nota: v === "" ? null : v });
      row && row.classList.remove("saving");
      if (ok) toastOk("✅ Nota actualizada");
    };
    inp.onblur = saveNow;
    inp.onkeydown = (e)=>{ if (e.key==="Enter"){ e.preventDefault(); inp.blur(); } };
  });
}

/* ===== Load médicos ===== */
async function cargarMedicos(){
  const {data, error} = await sb.rpc("get_medicos_activos");
  if (error){ elErr.textContent = error.message; return; }
  elMedico.innerHTML = `<option value="">Todos</option>`;
  (data||[]).forEach(m=>{
    const opt = document.createElement("option");
    opt.value = m.id;
    opt.textContent = m.nombre;
    elMedico.appendChild(opt);
  });
}

/* ===== Patch turno ===== */
async function patchTurno(turno_id, patch){
  elErr.textContent = "";
  const { error } = await sb.rpc("admin_update_turno", {
    p_turno_id: turno_id,
    p_estado: patch.estado ?? null,
    p_copago: patch.copago ?? null,
    p_nota: patch.nota ?? null,
    p_sobreturno: null
  });
  if (error){ elErr.textContent = error.message; return false; }
  return true;
}

/* ===== Load agenda ===== */
async function cargarAgenda(){
  elErr.textContent = ""; elOk.textContent = "";
  elBody.innerHTML = ""; elCards.innerHTML = ""; elKpis.innerHTML = "";

  const {data, error} = await sb.rpc("get_agenda_dia", {
    p_fecha: elFecha.value,
    p_medico_id: elMedico.value || null,
    p_estado: elEstado.value
  });
  if (error){ elErr.textContent = error.message; return; }

  const rows = data || [];

  const total = rows.length;
  const pendientes = rows.filter(r=>r.estado==="pendiente").length;
  const presentes  = rows.filter(r=>r.estado==="presente").length;
  const ausentes   = rows.filter(r=>r.estado==="ausente").length;
  const copagoTotal = rows.reduce((acc,r)=> acc + (Number(r.copago)||0), 0);

  elKpis.innerHTML = `
    <div class="pill">Total: <b>${total}</b></div>
    <div class="pill">Pendientes: <b>${pendientes}</b></div>
    <div class="pill">Presentes: <b>${presentes}</b></div>
    <div class="pill">Ausentes: <b>${ausentes}</b></div>
    <div class="pill">Copago total: <b>$${copagoTotal.toFixed(0)}</b></div>
  `;

  if (!rows.length){
    elBody.innerHTML = `<tr><td colspan="8" class="muted">Sin turnos para ese filtro.</td></tr>`;
    elCards.innerHTML = `<div class="muted">Sin turnos para ese filtro.</div>`;
    return;
  }

  // ✅ en vez de listar plano, renderizamos por médico
  renderAgendaAccordion(rows);
}

/* ===== MAIN ===== */
document.addEventListener("DOMContentLoaded", async () => {
  const { data } = await sb.auth.getUser();
  if (!data?.user) { window.location.href = "./login.html"; return; }

  btnLogout.onclick = async () => { await sb.auth.signOut(); window.location.href = "./login.html"; };
  btnRefresh.onclick = cargarAgenda;
  btnIrTurnos.onclick = () => { window.location.href = "./secre_turno.html"; };

  elFecha.value = isoDateARNow();

  elFecha.onchange = cargarAgenda;
  elMedico.onchange = cargarAgenda;
  elEstado.onchange = cargarAgenda;

  await cargarMedicos();
  await cargarAgenda();
});
</script>
</body>
</html>
