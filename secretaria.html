<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ENDO · Admin Secretaría</title>

  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;margin:0;background:#f6f7f8;color:#111}
    .wrap{max-width:1100px;margin:0 auto;padding:18px}
    .card{background:#fff;border:1px solid #e7e7e7;border-radius:14px;padding:16px;margin:12px 0}
    .header{display:flex;justify-content:space-between;gap:12px;align-items:center}
    .brand{font-weight:900}
    .muted{color:#666;font-size:13px}

    .row{display:grid;gap:10px;grid-template-columns:1fr 1fr 1fr}
    @media(max-width:900px){.row{grid-template-columns:1fr}}

    input,select{width:100%;padding:10px 12px;border-radius:12px;border:1px solid #ddd;font-size:14px;background:#fff;box-sizing:border-box}
    button{border:1px solid #ddd;background:#fff;border-radius:12px;padding:10px 12px;cursor:pointer}
    button.primary{background:#111;color:#fff;border:0;font-weight:800}
    button.small{padding:8px 10px;border-radius:10px;font-size:13px}
    .right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

    .kpi{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    .kpi .pill{border:1px solid #ddd;border-radius:999px;padding:6px 10px;font-size:12px;background:#fff}
    .error{color:#b00020;font-size:13px}
    .ok{color:#0a7a27;font-size:13px}
    .saving{opacity:.55}

    .tableWrap{overflow:auto}
    table{width:100%;border-collapse:collapse;min-width:980px}
    th,td{padding:10px;border-bottom:1px solid #eee;font-size:14px;vertical-align:middle}
    th{color:#666;font-weight:700;text-align:left;font-size:12px}

    select.estadoSelect{font-weight:800}
    select.estadoSelect.pendiente{background:#e7f0ff;border-color:#b6d0ff;color:#0b3d91}
    select.estadoSelect.presente{background:#dff5e5;border-color:#a7e1b7;color:#0f5132}
    select.estadoSelect.ausente{background:#fde2e6;border-color:#f2b7c2;color:#842029}

    .cards{display:none}
    .turnoCard{border:1px solid #eee;border-radius:14px;padding:12px;margin:10px 0}
    .turnoTop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
    .turnoHora{font-weight:900;font-size:18px}
    .turnoLinea{margin-top:6px;font-size:14px}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
    .actions .full{grid-column:1/-1}

    @media(max-width:900px){
      .tableWrap{display:none}
      .cards{display:block}
    }

    .accWrap{margin-top:6px}
    details.acc{border:1px solid #eee;border-radius:14px;margin:10px 0;overflow:hidden;background:#fff}
    details.acc summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-weight:900}
    details.acc summary::-webkit-details-marker{display:none}
    .pillMini{border:1px solid #ddd;border-radius:999px;padding:4px 8px;font-size:12px;background:#fff}
    .accBody{padding:0 10px 10px 10px}
    .innerTable{width:100%;border-collapse:collapse}
    .innerTable td{border-bottom:1px solid #eee}

    /* Paciente clickable */
    .pLink{font-weight:900;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

    /* ✅ Señal (check/rojo) al lado del nombre */
    .pSig{
      display:inline-flex;align-items:center;justify-content:center;
      width:18px;height:18px;border-radius:999px;border:1px solid #ddd;
      font-size:12px;margin-left:8px;line-height:1;
      user-select:none;
    }
    .pSig.ok{background:#dff5e5;border-color:#a7e1b7;color:#0f5132}
    .pSig.bad{background:#fde2e6;border-color:#f2b7c2;color:#842029}
    .pSig.unk{background:#fff;border-color:#ddd;color:#666}

    /* Modal */
    .modalBackdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;padding:14px;z-index:9999}
    .modal{background:#fff;border-radius:16px;max-width:760px;width:100%;border:1px solid #eee;box-shadow:0 20px 70px rgba(0,0,0,.2)}
    .modalHead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 14px 10px 14px}
    .modalTitle{font-weight:900}
    .modalBody{padding:0 14px 14px 14px}
    .modalGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    @media(max-width:700px){.modalGrid{grid-template-columns:1fr}}
    .box{border:1px solid #eee;border-radius:14px;padding:12px}
    .warn{border-radius:14px;padding:12px;font-weight:900}
    .warn.ok{background:#dff5e5;border:1px solid #a7e1b7;color:#0f5132}
    .warn.bad{background:#fde2e6;border:1px solid #f2b7c2;color:#842029}
    .histItem{border-bottom:1px solid #eee;padding:10px 0}
    .histItem:last-child{border-bottom:0}
  </style>
</head>

<body>
<div class="wrap">
  <div class="header">
    <div>
      <div class="brand">ENDO · Admin Secretaría</div>
      <div class="muted">Agenda diaria</div>
    </div>
    <div class="right">
      <button id="btnRefresh" class="primary" type="button">Actualizar</button>
      <button id="btnDispo" class="small" type="button">Disponibilidad</button>
      <button id="btnIrTurnos" class="small" type="button">Turnos / Sobreturnos</button>
      <button id="btnLogout" class="small" type="button">Salir</button>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <div>
        <div class="muted">Fecha</div>
        <input id="fecha" type="date" />
      </div>
      <div>
        <div class="muted">Médico</div>
        <select id="medico">
          <option value="">Todos</option>
        </select>
      </div>
      <div>
        <div class="muted">Estado</div>
        <select id="estado">
          <option value="pendiente" selected>Pendiente</option>
          <option value="presente">Presente</option>
          <option value="ausente">Ausente</option>
          <option value="todos">Todos</option>
        </select>
      </div>
    </div>

    <div class="kpi" id="kpis"></div>
    <div class="error" id="err"></div>
    <div class="ok" id="ok"></div>
  </div>

  <!-- Desktop -->
  <div class="card tableWrap">
    <table>
      <thead>
        <tr>
          <th>Hora</th>
          <th>Médico</th>
          <th>Paciente</th>
          <th>Obra social</th>
          <th>Copago</th>
          <th>Estado</th>
          <th>Práctica</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <!-- Mobile -->
  <div class="card cards" id="cards"></div>
</div>

<!-- Modal Paciente -->
<div class="modalBackdrop" id="modalBackdrop">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modalHead">
      <div>
        <div class="modalTitle" id="mTitle">Paciente</div>
        <div class="muted" id="mSub">—</div>
      </div>
      <button class="small" id="btnCloseModal" type="button">Cerrar</button>
    </div>
    <div class="modalBody">
      <div class="modalGrid">
        <div class="box">
          <div class="muted">Teléfono</div>
          <div id="mTel">—</div>
        </div>
        <div class="box">
          <div class="muted">Email</div>
          <div id="mEmail">—</div>
        </div>
        <div class="box">
          <div class="muted">Obra social</div>
          <div id="mOS">—</div>
        </div>
        <div class="box">
          <div class="muted">Afiliado</div>
          <div id="mAf">—</div>
        </div>
      </div>

      <div style="height:10px"></div>
      <div class="warn ok" id="mWarn">Cargando warning…</div>

      <div style="height:12px"></div>
      <div class="box">
        <div class="brand" style="font-weight:900">Historial (últimos 2 años)</div>
        <div class="muted">Se carga al abrir la ficha.</div>
        <div id="mHist" style="margin-top:10px"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===== CONFIG ===== */
const SUPABASE_URL = "https://qqfjvxspiyecuthislnq.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFxZmp2eHNwaXllY3V0aGlzbG5xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk2MjE2OTQsImV4cCI6MjA4NTE5NzY5NH0.xHIldO1nBfhHJYLuskqJbkX95EbxRAjc4Y3SqHhlx3A";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const AR_TZ = "America/Argentina/Buenos_Aires";

/* ===== Auto logout (inactividad) ===== */
const IDLE_MIN = 20; // <-- cambiá acá
let idleTimer = null;
function resetIdle(){
  if (idleTimer) clearTimeout(idleTimer);
  idleTimer = setTimeout(async ()=>{
    try{ await sb.auth.signOut(); }catch(e){}
    window.location.href = "./login.html";
  }, IDLE_MIN * 60 * 1000);
}
["click","keydown","mousemove","touchstart","scroll"].forEach(ev=> window.addEventListener(ev, resetIdle, {passive:true}));
resetIdle();

/* ===== DOM ===== */
const elFecha  = document.getElementById("fecha");
const elMedico = document.getElementById("medico");
const elEstado = document.getElementById("estado");
const elErr    = document.getElementById("err");
const elOk     = document.getElementById("ok");
const elBody   = document.getElementById("tbody");
const elCards  = document.getElementById("cards");
const elKpis   = document.getElementById("kpis");

const btnRefresh = document.getElementById("btnRefresh");
const btnIrTurnos = document.getElementById("btnIrTurnos");
const btnDispo = document.getElementById("btnDispo");
const btnLogout = document.getElementById("btnLogout");

/* Modal */
const modalBackdrop = document.getElementById("modalBackdrop");
const btnCloseModal = document.getElementById("btnCloseModal");
const mTitle = document.getElementById("mTitle");
const mSub = document.getElementById("mSub");
const mTel = document.getElementById("mTel");
const mEmail = document.getElementById("mEmail");
const mOS = document.getElementById("mOS");
const mAf = document.getElementById("mAf");
const mWarn = document.getElementById("mWarn");
const mHist = document.getElementById("mHist");

/* Prácticas */
let PRACTICAS = [
  { id:"consulta", nombre:"Consulta" },
  { id:"rino", nombre:"Rinofibrolaringoscopia" },
  { id:"eco", nombre:"Ecografía" },
];
let PRACTICAS_FROM_DB = false;

/* ✅ Flags de ausentes (map) para pintar check/cruz sin abrir modal */
let AUSENTES_FLAG = new Map(); // paciente_id -> true/false

/* ===== Helpers ===== */
function isoDateARNow(){
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: AR_TZ, year:"numeric", month:"2-digit", day:"2-digit"
  }).formatToParts(new Date());
  const y = parts.find(p=>p.type==="year").value;
  const m = parts.find(p=>p.type==="month").value;
  const d = parts.find(p=>p.type==="day").value;
  return `${y}-${m}-${d}`;
}
function fmtHora(ts){
  return new Date(ts).toLocaleTimeString("es-AR", { timeZone: AR_TZ, hour:"2-digit", minute:"2-digit" });
}
function toastOk(msg){
  elOk.textContent = msg;
  setTimeout(()=> elOk.textContent="", 1200);
}
function applyEstadoColor(sel){
  sel.classList.remove("pendiente","presente","ausente");
  if (["pendiente","presente","ausente"].includes(sel.value)) sel.classList.add(sel.value);
}
function groupByMedico(rows){
  const map = new Map();
  (rows||[]).forEach(r=>{
    const key = r.medico_id || r.medico_nombre || "sin_medico";
    if (!map.has(key)) map.set(key, { medico_id: r.medico_id, medico_nombre: r.medico_nombre || "—", items: [] });
    map.get(key).items.push(r);
  });
  return Array.from(map.values()).sort((a,b)=> (a.medico_nombre||"").localeCompare(b.medico_nombre||""));
}
function safeId(str){
  return String(str||"x").replaceAll(/[^a-zA-Z0-9_]/g,"_");
}

/* ===== Modal ===== */
function openModal(){ modalBackdrop.style.display = "flex"; }
function closeModal(){ modalBackdrop.style.display = "none"; }
btnCloseModal.onclick = closeModal;
modalBackdrop.addEventListener("click", (e)=>{ if (e.target === modalBackdrop) closeModal(); });

function setWarn(ok, text){
  mWarn.classList.remove("ok","bad");
  mWarn.classList.add(ok ? "ok" : "bad");
  mWarn.textContent = text;
}

/* ===== RPCs ===== */
async function patchTurno(turno_id, patch){
  elErr.textContent = "";
  const practicaFallback = patch.practica_text ?? null;

  const { error } = await sb.rpc("admin_update_turno", {
    p_turno_id: turno_id,
    p_estado: patch.estado ?? null,
    p_copago: patch.copago ?? null,
    p_nota: patch.nota ?? practicaFallback,
    p_sobreturno: null
  });
  if (error){ elErr.textContent = error.message; return false; }
  return true;
}

/* ===== Prácticas (intenta DB, si no hay queda hardcode) ===== */
async function cargarPracticas(){
  try{
    const { data, error } = await sb.from("Practicas").select("id,nombre").order("nombre");
    if (error) return;
    if ((data||[]).length){
      PRACTICAS = data;
      PRACTICAS_FROM_DB = true;
    }
  }catch(e){}
}
function practicaOptionsHTML(selected){
  const opts = PRACTICAS.map(p=>{
    const v = p.id;
    return `<option value="${v}" ${String(selected)===String(v)?"selected":""}>${p.nombre}</option>`;
  }).join("");
  return `<option value="">—</option>${opts}`;
}

/* ✅ NUEVO: cargar flags de ausentes para pintar check/cruz SIN abrir modal */
async function cargarFlagsAusentes(p_fecha, p_medico_id){
  AUSENTES_FLAG = new Map();

  try{
    // Esperado: [{paciente_id: uuid, tiene_ausentes: boolean}]
    const { data, error } = await sb.rpc("secre_flags_ausentes_agenda", {
      p_fecha,
      p_medico_id: p_medico_id || null
    });
    if (error) throw error;

    (data||[]).forEach(x=>{
      if (!x?.paciente_id) return;
      AUSENTES_FLAG.set(String(x.paciente_id), !!x.tiene_ausentes);
    });
  }catch(e){
    // fallback: dejamos unknown (?)
    // no rompemos agenda
  }
}
function sigHTMLForPaciente(pacienteId){
  const pid = String(pacienteId || "");
  if (!pid) return `<span class="pSig unk" title="Sin paciente_id">?</span>`;

  if (!AUSENTES_FLAG.size) return `<span class="pSig unk" title="Sin datos (flags)">?</span>`;

  const tiene = AUSENTES_FLAG.get(pid);
  if (tiene === true) return `<span class="pSig bad" title="Tiene ausentes">✕</span>`;
  if (tiene === false) return `<span class="pSig ok" title="Sin ausentes">✓</span>`;
  return `<span class="pSig unk" title="Sin datos">?</span>`;
}

/* ===== Ficha paciente (warning + historial lazy) ===== */
async function abrirFichaPaciente(r){
  const pacienteId = r.paciente_id || r.id_paciente || r.paciente_uuid || null;

  mTitle.textContent = r.paciente_nombre || "Paciente";
  mSub.textContent = r.dni ? `DNI: ${r.dni}` : "—";

  mTel.textContent = r.telefono || "-";
  mEmail.textContent = r.email || "-";
  mOS.textContent = r.obra_social || "-";
  mAf.textContent = r.numero_afiliado || "-";

  mHist.innerHTML = `<div class="muted">Cargando…</div>`;
  setWarn(true, "Cargando warning…");
  openModal();

  if (!pacienteId){
    setWarn(false, "⚠️ Falta paciente_id en get_agenda_dia (no puedo traer warning/historial).");
    mHist.innerHTML = `<div class="muted">Sin historial (falta paciente_id).</div>`;
    return;
  }

  // 1) Warning
  try{
    const { data, error } = await sb.rpc("secre_warning_paciente", { p_paciente_id: pacienteId, p_anios: 2 });
    if (error) throw error;

    const has = !!(data?.has_warning ?? data?.warning ?? data?.tiene_warning ?? data?.ausentes ?? data?.count_ausentes);
    const msg = data?.mensaje || data?.texto || (has ? "⚠️ Tiene ausencias / warning" : "✅ Sin ausencias (OK)");
    setWarn(!has, msg);
  }catch(e){
    setWarn(false, "⚠️ No pude leer warning.");
  }

  // 2) Historial 2 años
  try{
    const { data, error } = await sb.rpc("secre_historial_paciente", { p_paciente_id: pacienteId, p_anios: 2 });
    if (error) throw error;

    const rows = data || [];
    if (!rows.length){
      mHist.innerHTML = `<div class="muted">Sin historial en los últimos 2 años.</div>`;
      return;
    }

    mHist.innerHTML = rows.map(h=>{
      const fecha = h?.inicio ? new Date(h.inicio).toLocaleDateString("es-AR",{timeZone:AR_TZ}) : (h?.fecha || "-");
      const hora = h?.inicio ? fmtHora(h.inicio) : "";
      const medico = h?.medico_nombre || h?.medico || "-";
      const estado = h?.estado || "-";
      const practica = h?.practica_nombre || h?.practica || "";
      return `
        <div class="histItem">
          <div><b>${fecha}</b> ${hora ? "· "+hora : ""} · <span class="muted">${medico}</span></div>
          <div class="muted">Estado: <b>${estado}</b> ${practica ? "· Práctica: <b>"+practica+"</b>" : ""}</div>
        </div>
      `;
    }).join("");
  }catch(e){
    mHist.innerHTML = `<div class="muted">No pude cargar historial.</div>`;
  }
}

/* ===== Render ===== */
function renderAgendaAccordion(rows, flagMap = new Map()){
  elBody.innerHTML = "";
  elCards.innerHTML = "";

  const grupos = groupByMedico(rows);

  // Desktop
  grupos.forEach(g=>{
    const gid = safeId(g.medico_id || g.medico_nombre);
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td colspan="7" style="padding:0;border-bottom:0">
        <details class="acc" open>
          <summary>
            <span>${g.medico_nombre}</span>
            <span class="pillMini">Turnos: <b>${g.items.length}</b></span>
          </summary>
          <div class="accBody">
            <table class="innerTable">
              <tbody id="inner_${gid}"></tbody>
            </table>
          </div>
        </details>
      </td>
    `;
    elBody.appendChild(tr);

    const inner = tr.querySelector(`#inner_${gid}`);

    g.items.forEach(r=>{
      const row = document.createElement("tr");
      row.dataset.turno = r.turno_id;

      const practicaSelected = r.practica_id || r.practica || "";
      const pacienteId = r.paciente_id || r.id_paciente || r.paciente_uuid || null;

      row.innerHTML = `
        <td style="width:80px"><b>${fmtHora(r.inicio)}</b></td>
        <td>${r.medico_nombre || "-"}</td>
        <td>
          <span class="pLink" data-ficha="${r.turno_id}">${r.paciente_nombre || "-"}</span>
          ${sigHTMLForPaciente(pacienteId)}
        </td>
        <td>${r.obra_social || "-"} ${r.numero_afiliado ? "· " + r.numero_afiliado : ""}</td>
        <td><input data-copago="${r.turno_id}" value="${r.copago ?? ""}" placeholder="0" inputmode="numeric"/></td>
        <td>
          <select class="estadoSelect" data-estado="${r.turno_id}">
            <option value="pendiente" ${r.estado==="pendiente"?"selected":""}>Pendiente</option>
            <option value="presente"  ${r.estado==="presente" ?"selected":""}>Presente</option>
            <option value="ausente"   ${r.estado==="ausente"  ?"selected":""}>Ausente</option>
          </select>
        </td>
        <td>
          <select data-practica="${r.turno_id}">
            ${practicaOptionsHTML(practicaSelected)}
          </select>
        </td>
      `;
      inner.appendChild(row);

      row.querySelector(`[data-ficha="${r.turno_id}"]`).onclick = ()=> abrirFichaPaciente(r);
    });
  });

  // Mobile
  grupos.forEach(g=>{
    const det = document.createElement("details");
    det.className = "acc";
    det.open = true;
    det.innerHTML = `
      <summary>
        <span>${g.medico_nombre}</span>
        <span class="pillMini">Turnos: <b>${g.items.length}</b></span>
      </summary>
      <div class="accBody"></div>
    `;
    elCards.appendChild(det);

    const inner = det.querySelector(".accBody");
    g.items.forEach(r=>{
      const div = document.createElement("div");
      div.className = "turnoCard";
      div.dataset.turno = r.turno_id;

      const practicaSelected = r.practica_id || r.practica || "";
      const pacienteId = r.paciente_id || r.id_paciente || r.paciente_uuid || null;

      div.innerHTML = `
        <div class="turnoTop">
          <div>
            <div class="turnoHora">${fmtHora(r.inicio)}</div>
            <div class="muted">${r.medico_nombre || "-"}</div>
          </div>
        </div>

        <div class="turnoLinea">
          <b>Paciente:</b>
          <span class="pLink" data-ficha="${r.turno_id}">${r.paciente_nombre || "-"}</span>
          ${sigHTMLForPaciente(pacienteId)}
        </div>

        <div class="turnoLinea"><b>OS:</b> ${r.obra_social || "-"} ${r.numero_afiliado ? "· " + r.numero_afiliado : ""}</div>

        <div class="actions">
          <select class="full estadoSelect" data-estado="${r.turno_id}">
            <option value="pendiente" ${r.estado==="pendiente"?"selected":""}>Pendiente</option>
            <option value="presente"  ${r.estado==="presente" ?"selected":""}>Presente</option>
            <option value="ausente"   ${r.estado==="ausente"  ?"selected":""}>Ausente</option>
          </select>

          <input class="full" data-copago="${r.turno_id}" value="${r.copago ?? ""}" placeholder="Copago" inputmode="numeric" />

          <select class="full" data-practica="${r.turno_id}">
            ${practicaOptionsHTML(practicaSelected)}
          </select>
        </div>
      `;
      inner.appendChild(div);

      div.querySelector(`[data-ficha="${r.turno_id}"]`).onclick = ()=> abrirFichaPaciente(r);
    });
  });

  // wiring
  document.querySelectorAll("select.estadoSelect").forEach(applyEstadoColor);

  document.querySelectorAll("[data-estado]").forEach(sel=>{
    sel.onchange = async () => {
      applyEstadoColor(sel);
      const id = sel.getAttribute("data-estado");
      const row = document.querySelector(`[data-turno="${id}"]`);
      row && row.classList.add("saving");
      const ok = await patchTurno(id, { estado: sel.value });
      row && row.classList.remove("saving");
      if (ok) toastOk("✅ Estado actualizado");
    };
  });

  document.querySelectorAll("[data-copago]").forEach(inp=>{
    const saveNow = async ()=>{
      const id = inp.getAttribute("data-copago");
      const v = (inp.value ?? "").trim();
      const num = v === "" ? null : Number(v);
      if (v !== "" && Number.isNaN(num)) return;

      const row = document.querySelector(`[data-turno="${id}"]`);
      row && row.classList.add("saving");
      const ok = await patchTurno(id, { copago: num });
      row && row.classList.remove("saving");
      if (ok) toastOk("✅ Copago actualizado");
    };
    inp.onblur = saveNow;
    inp.onkeydown = (e)=>{ if (e.key==="Enter"){ e.preventDefault(); inp.blur(); } };
  });

  // Práctica: fallback a nota
  document.querySelectorAll("[data-practica]").forEach(sel=>{
    sel.onchange = async ()=>{
      const id = sel.getAttribute("data-practica");
      const val = sel.value || null;
      const label = (PRACTICAS.find(p=>String(p.id)===String(val))||{}).nombre || null;

      const row = document.querySelector(`[data-turno="${id}"]`);
      row && row.classList.add("saving");

      const ok = await patchTurno(id, { practica_text: label ? `Práctica: ${label}` : null });

      row && row.classList.remove("saving");
      if (ok) toastOk("✅ Práctica actualizada");
    };
  });
}

/* ===== Load médicos ===== */
async function cargarMedicos(){
  const {data, error} = await sb.rpc("get_medicos_activos");
  if (error){ elErr.textContent = error.message; return; }
  elMedico.innerHTML = `<option value="">Todos</option>`;
  (data||[]).forEach(m=>{
    const opt = document.createElement("option");
    opt.value = m.id;
    opt.textContent = m.nombre;
    elMedico.appendChild(opt);
  });
}

/* ===== Load agenda ===== */
async function cargarAgenda(){
  elErr.textContent = ""; elOk.textContent = "";
  elBody.innerHTML = ""; elCards.innerHTML = ""; elKpis.innerHTML = "";

  const {data, error} = await sb.rpc("get_agenda_dia", {
    p_fecha: elFecha.value,
    p_medico_id: elMedico.value || null,
    p_estado: elEstado.value
  });
  if (error){ elErr.textContent = error.message; return; }

  const rows = data || [];

  // ✅ Cargamos flags de ausentes una vez, para pintar check/cruz
  await cargarFlagsAusentes(elFecha.value, elMedico.value || null);

  const total = rows.length;
  const pendientes = rows.filter(r=>r.estado==="pendiente").length;
  const presentes  = rows.filter(r=>r.estado==="presente").length;
  const ausentes   = rows.filter(r=>r.estado==="ausente").length;
  const copagoTotal = rows.reduce((acc,r)=> acc + (Number(r.copago)||0), 0);

  elKpis.innerHTML = `
    <div class="pill">Total: <b>${total}</b></div>
    <div class="pill">Pendientes: <b>${pendientes}</b></div>
    <div class="pill">Presentes: <b>${presentes}</b></div>
    <div class="pill">Ausentes: <b>${ausentes}</b></div>
    <div class="pill">Copago total: <b>$${copagoTotal.toFixed(0)}</b></div>
  `;

  if (!rows.length){
    elBody.innerHTML = `<tr><td colspan="7" class="muted">Sin turnos para ese filtro.</td></tr>`;
    elCards.innerHTML = `<div class="muted">Sin turnos para ese filtro.</div>`;
    return;
  }

  renderAgendaAccordion(rows, flagMap);
}

/* ===== MAIN ===== */
document.addEventListener("DOMContentLoaded", async () => {
  const { data } = await sb.auth.getUser();
  if (!data?.user) { window.location.href = "./login.html"; return; }

  btnLogout.onclick = async () => { await sb.auth.signOut(); window.location.href = "./login.html"; };
  btnRefresh.onclick = cargarAgenda;
  btnIrTurnos.onclick = () => { window.location.href = "./secre_turno.html"; };
  btnDispo.onclick = () => { window.location.href = "./disponibilidad.html"; };

  elFecha.value = isoDateARNow();

  elFecha.onchange = cargarAgenda;
  elMedico.onchange = cargarAgenda;
  elEstado.onchange = cargarAgenda;

  await cargarPracticas();
  await cargarMedicos();
  await cargarAgenda();
});
</script>
