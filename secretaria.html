<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ENDO · Secretaría</title>

<style>
body{font-family:system-ui; margin:0; background:#f6f7f8}
.wrap{max-width:1200px; margin:auto; padding:16px}
h1{margin:0 0 12px 0}
.card{background:#fff; border-radius:12px; padding:14px; margin-bottom:14px}
.row{display:flex; gap:12px; flex-wrap:wrap}
.stat{flex:1; min-width:140px; border-radius:10px; padding:10px; background:#fafafa}
.stat b{font-size:20px}

table{width:100%; border-collapse:collapse; font-size:14px}
th,td{padding:8px; border-bottom:1px solid #eee}
th{text-align:left; font-size:12px; color:#666}

.estado{padding:6px 10px; border-radius:999px; font-size:12px}
.pendiente{background:#eaeaea}
.presente{background:#d7f5e3}
.ausente{background:#fde2e2}
.sobreturno{background:#ffe7c2}

select,input{padding:6px 8px; border-radius:8px; border:1px solid #ccc}
button{padding:6px 10px; border-radius:8px; border:0; background:#111; color:#fff; cursor:pointer}
button.small{padding:4px 8px; font-size:12px}
</style>
</head>

<body>
<div class="wrap">

<h1>Agenda · Secretaría</h1>

<!-- FILTROS -->
<div class="card row">
  <div>
    <label>Fecha</label><br/>
    <input type="date" id="fFecha"/>
  </div>

  <div>
    <label>Médico</label><br/>
    <select id="fMedico">
      <option value="">Todos</option>
    </select>
  </div>

  <div style="align-self:flex-end">
    <button onclick="cargarAgenda()">Actualizar</button>
  </div>
</div>

<!-- MÉTRICAS -->
<div class="card row">
  <div class="stat">Total<br><b id="mTotal">0</b></div>
  <div class="stat">Presentes<br><b id="mPresente">0</b></div>
  <div class="stat">Ausentes<br><b id="mAusente">0</b></div>
  <div class="stat">Sobreturnos<br><b id="mSobre">0</b></div>
  <div class="stat">Copago día<br><b>$ <span id="mCaja">0</span></b></div>
</div>

<!-- TABLA -->
<div class="card">
<table>
<thead>
<tr>
  <th>Hora</th>
  <th>Paciente</th>
  <th>Médico</th>
  <th>Estado</th>
  <th>Copago</th>
  <th>Acción</th>
</tr>
</thead>
<tbody id="tablaTurnos"></tbody>
</table>
</div>

</div>

<script>
/* ===== CONFIG ===== */
const SUPABASE_URL = "TU_URL";
const SUPABASE_KEY = "TU_KEY";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ===== INIT ===== */
document.getElementById("fFecha").value =
  new Date().toISOString().slice(0,10);

cargarMedicos();
cargarAgenda();

/* ===== MÉDICOS ===== */
async function cargarMedicos(){
  const {data} = await sb.from("Medicos").select("id,Nombre");
  const sel = document.getElementById("fMedico");
  data?.forEach(m=>{
    const o=document.createElement("option");
    o.value=m.id; o.textContent=m.Nombre;
    sel.appendChild(o);
  });
}

/* ===== AGENDA ===== */
async function cargarAgenda(){
  const fecha = document.getElementById("fFecha").value;
  const medico = document.getElementById("fMedico").value;

  // 👉 ESTA RPC la armamos después
  const {data} = await sb.rpc("agenda_dia",{
    p_fecha: fecha,
    p_medico_id: medico || null
  });

  renderAgenda(data||[]);
}

/* ===== RENDER ===== */
function renderAgenda(rows){
  const tb = document.getElementById("tablaTurnos");
  tb.innerHTML="";

  let total=0, pres=0, aus=0, sobre=0, caja=0;

  rows.forEach(r=>{
    total++;
    if(r.estado==="presente") pres++;
    if(r.estado==="ausente") aus++;
    if(r.sobreturno) sobre++;
    caja += Number(r.copago||0);

    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${r.hora}</td>
      <td>${r.paciente}</td>
      <td>${r.medico}</td>
      <td><span class="estado ${r.estado}">${r.estado}</span></td>
      <td>$ ${r.copago||0}</td>
      <td>
        <button class="small" onclick="setEstado('${r.id}','presente')">✔</button>
        <button class="small" onclick="setEstado('${r.id}','ausente')">✖</button>
      </td>`;
    tb.appendChild(tr);
  });

  mTotal.textContent=total;
  mPresente.textContent=pres;
  mAusente.textContent=aus;
  mSobre.textContent=sobre;
  mCaja.textContent=caja;
}

/* ===== UPDATE ESTADO ===== */
async function setEstado(id,estado){
  await sb.from("Turnos")
    .update({estado})
    .eq("turno_id",id);
  cargarAgenda();
}
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</body>
</html>
